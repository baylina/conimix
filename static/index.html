<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="coniMIX">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<title>coniMIX</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0b0b0d; --s1:#141417; --s2:#1c1c21; --s3:#26262d; --line:rgba(255,255,255,.08);
    --fg:#f5f5f7; --mut:#9a9aa6; --acc:#1ed760; --acc-ink:#04210e; --danger:#ff6b6b;
    --nav-h:58px; --mini-h:64px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
    --bottom:calc(var(--nav-h) + var(--safe-b));
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif; overscroll-behavior-y:none; }
  [hidden] { display:none !important; }
  button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; padding:0; }
  button:disabled { opacity:.4; cursor:default; }
  input { font:inherit; color:inherit; }
  svg.ic { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  svg.ic.f { fill:currentColor; }

  /* app bar */
  .appbar { position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; padding:calc(10px + var(--safe-t)) 16px 10px; background:rgba(11,11,13,.82); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border-bottom:1px solid var(--line); }
  .logo { display:flex; align-items:center; gap:10px; font-weight:800; font-size:19px; letter-spacing:-.02em; }
  .logo .mark { width:36px; height:36px; border-radius:50%; object-fit:cover; background:#fff; box-shadow:0 0 0 2px var(--acc); }
  .logo b { background:linear-gradient(90deg,#29b6ff,#7ed957,#ff8a2b); -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:900; }
  .actions { display:flex; gap:4px; }
  .ib { width:42px; height:42px; border-radius:50%; display:grid; place-items:center; color:var(--fg); }
  .ib:active, .rb:active { background:var(--s3); }

  /* jam (guest) look: indigo + pink so it is obvious you are not the host */
  :root[data-mode=jam] { --bg:#0f0a1f; --s1:#171030; --s2:#20173f; --s3:#2e2358; --acc:#ff6bd6; --acc-ink:#2b0626; --line:rgba(255,255,255,.1); }
  :root[data-mode=jam] body { background:radial-gradient(1200px 500px at 50% -10%, #2a1458 0%, var(--bg) 60%) fixed; }
  :root[data-mode=jam] .appbar { background:rgba(15,10,31,.82); }
  :root[data-mode=jam] .row { background:transparent; }
  .jambar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 16px; background:linear-gradient(90deg,#3a1b73,#6a1f66); border-bottom:1px solid var(--line); font-size:13px; }
  .jambar span { color:#f0e6ff; line-height:1.25; }
  .jambar .jbtn { flex:none; background:var(--acc); color:var(--acc-ink); font-weight:700; padding:8px 14px; border-radius:999px; text-decoration:none; font-size:13px; white-space:nowrap; }
  main { max-width:720px; margin:0 auto; padding:6px 16px calc(var(--bottom) + 28px); min-height:70vh; }
  h1.title { font-size:30px; font-weight:800; letter-spacing:-.03em; margin:14px 0 14px; }
  .sec { display:flex; align-items:center; justify-content:space-between; margin:22px 0 8px; color:var(--mut); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; }
  .link { color:var(--acc); font-weight:600; font-size:14px; text-transform:none; letter-spacing:0; padding:6px 0 6px 12px; }
  .link.dng { color:var(--danger); }

  /* search box */
  .searchbar { display:flex; align-items:center; gap:10px; background:var(--s2); border-radius:14px; padding:0 14px; height:50px; border:1px solid transparent; margin-bottom:12px; }
  .searchbar:focus-within { border-color:var(--acc); background:var(--s1); }
  .searchbar svg { color:var(--mut); }
  .searchbar input { flex:1; min-width:0; background:none; border:0; outline:0; height:100%; font-size:16px; }
  .searchbar input::placeholder { color:var(--mut); }
  .searchbar input::-webkit-search-cancel-button, .searchbar input::-webkit-search-decoration { -webkit-appearance:none; appearance:none; display:none; }
  .searchbar .x { width:30px; height:30px; display:grid; place-items:center; color:var(--mut); }

  /* rows */
  .list { display:flex; flex-direction:column; gap:2px; position:relative; }
  .row { display:flex; align-items:center; gap:12px; padding:8px 6px; border-radius:12px; position:relative; background:var(--bg); flex-wrap:wrap; }
  .row[data-act]:active { background:var(--s2); }
  .row.cur { background:linear-gradient(90deg, rgba(30,215,96,.13), rgba(30,215,96,0)); }
  .row.dim .th, .row.dim .mt .t { opacity:.55; }
  .row.drag { z-index:5; background:var(--s3); box-shadow:0 10px 30px rgba(0,0,0,.5); transition:none !important; }
  .list.sorting .row:not(.drag) { transition:transform .16s ease; }
  .th { width:50px; height:50px; border-radius:8px; object-fit:cover; background:var(--s3); flex:none; }
  .mt { flex:1; min-width:0; }
  .t { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row.cur .t { color:var(--acc); }
  .s { color:var(--mut); font-size:13px; margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; gap:6px; align-items:center; }
  .s .ok { color:var(--acc); display:inline-flex; align-items:center; gap:3px; }
  .s .ok svg { width:13px; height:13px; stroke-width:3; }
  .s .er { color:var(--danger); white-space:normal; }
  .rb { width:40px; height:40px; border-radius:50%; display:grid; place-items:center; color:var(--mut); flex:none; }
  .rb.play { background:var(--acc); color:var(--acc-ink); }
  .rb.add { background:var(--s3); color:var(--fg); }
  .rb.done { color:var(--acc); }
  .grip { touch-action:none; cursor:grab; width:36px; }
  .bar { height:3px; border-radius:2px; background:var(--s3); overflow:hidden; width:100%; margin:0 0 2px; order:9; }
  .bar i { display:block; height:100%; background:var(--acc); transition:width .4s; }
  .eq { display:inline-flex; gap:2px; align-items:flex-end; height:13px; margin-right:2px; }
  .eq i { width:3px; background:var(--acc); border-radius:1px; animation:eq 1s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay:.2s; } .eq i:nth-child(3) { animation-delay:.4s; }
  .eq.paused i { animation-play-state:paused; }
  @keyframes eq { 0%,100% { height:3px } 50% { height:13px } }

  /* buttons */
  .btn { height:44px; padding:0 16px; white-space:nowrap; border-radius:999px; background:var(--s3); font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
  .btn.pri { background:var(--acc); color:var(--acc-ink); }
  .btn.block { width:100%; }
  .btn.dng { color:var(--danger); }
  .btnrow { display:flex; gap:10px; margin:6px 0 4px; }
  .btnrow .btn { flex:1; }

  /* cards */
  .pcard { display:flex; align-items:center; gap:14px; padding:10px 6px; border-radius:14px; width:100%; text-align:left; }
  .pcard:active { background:var(--s2); }
  .cover { width:58px; height:58px; border-radius:10px; background:var(--s3); display:grid; place-items:center; color:var(--mut); overflow:hidden; flex:none; }
  .cover img { width:100%; height:100%; object-fit:cover; }
  .cover.big { width:112px; height:112px; border-radius:14px; }
  .phead { display:flex; gap:16px; align-items:center; margin:2px 0 16px; }
  .phead h1 { margin:0 0 4px; font-size:26px; letter-spacing:-.03em; line-height:1.1; word-break:break-word; }
  .back { display:inline-flex; align-items:center; gap:2px; color:var(--acc); font-weight:600; padding:6px 8px 6px 0; margin-top:8px; }
  .back svg { width:20px; height:20px; }
  .empty { text-align:center; color:var(--mut); padding:46px 20px; }
  .empty svg { width:44px; height:44px; opacity:.5; margin-bottom:10px; }
  .empty b { display:block; color:var(--fg); font-size:17px; margin-bottom:4px; }
  .skel { height:66px; border-radius:12px; margin:4px 0; background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1)); background-size:200% 100%; animation:sh 1.2s linear infinite; }
  @keyframes sh { to { background-position:-200% 0 } }
  .note { background:var(--s2); border-radius:12px; padding:10px 14px; color:var(--mut); font-size:13px; margin-bottom:12px; }

  /* bottom: mini player + nav */
  #mini { position:fixed; left:8px; right:8px; bottom:calc(var(--nav-h) + var(--safe-b) + 6px); z-index:30; height:var(--mini-h); border-radius:14px; background:var(--s3); display:none; align-items:center; gap:10px; padding:0 8px; box-shadow:0 8px 28px rgba(0,0,0,.45); overflow:hidden; max-width:704px; margin:0 auto; }
  #mini.on { display:flex; }
  #mini .th { width:46px; height:46px; }
  #mini .mt { cursor:pointer; }
  #mini .prog { position:absolute; left:0; bottom:0; height:2px; background:var(--acc); width:0; }
  nav { position:fixed; left:0; right:0; bottom:0; z-index:25; height:calc(var(--nav-h) + var(--safe-b)); padding-bottom:var(--safe-b); display:flex; background:rgba(14,14,16,.92); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border-top:1px solid var(--line); }
  nav button { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--mut); font-size:11px; font-weight:600; position:relative; }
  nav button.on { color:var(--acc); }
  nav .badge { position:absolute; top:6px; left:calc(50% + 6px); background:var(--acc); color:var(--acc-ink); border-radius:9px; min-width:17px; height:17px; font-size:10px; display:grid; place-items:center; padding:0 4px; }

  /* sheets */
  #backdrop { position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.55); opacity:0; pointer-events:none; transition:opacity .2s; }
  #backdrop.on { opacity:1; pointer-events:auto; }
  #sheet { position:fixed; left:0; right:0; bottom:0; z-index:61; max-width:560px; margin:0 auto; background:var(--s2); border-radius:20px 20px 0 0; padding:8px 16px calc(16px + var(--safe-b)); transform:translateY(105%); transition:transform .24s cubic-bezier(.2,.8,.2,1); max-height:86vh; overflow:auto; }
  #sheet.on { transform:none; }
  #sheet .grab { width:38px; height:4px; border-radius:2px; background:var(--s3); margin:4px auto 12px; }
  #sheet .shead { display:flex; gap:12px; align-items:center; padding:2px 0 12px; border-bottom:1px solid var(--line); margin-bottom:6px; }
  #sheet .shead .th { width:48px; height:48px; }
  #sheet h3 { margin:0 0 6px; font-size:18px; }
  #sheet p { color:var(--mut); margin:0 0 14px; }
  .opt { display:flex; align-items:center; gap:14px; width:100%; padding:13px 4px; text-align:left; border-radius:10px; }
  .opt:active { background:var(--s3); }
  .opt.dng { color:var(--danger); }
  .opt small { display:block; color:var(--mut); font-size:12.5px; }
  .opt svg { color:var(--mut); } .opt.dng svg { color:var(--danger); }
  .sinput { width:100%; height:50px; border-radius:12px; border:1px solid var(--line); background:var(--s1); padding:0 14px; font-size:16px; margin-bottom:14px; outline:0; }
  .sinput:focus { border-color:var(--acc); }

  /* now playing */
  #np { position:fixed; inset:0; z-index:50; background:linear-gradient(180deg,#1b2a22 0%,#0b0b0d 60%); transform:translateY(105%); transition:transform .3s cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column; padding:calc(10px + var(--safe-t)) 24px calc(24px + var(--safe-b)); }
  #np.on { transform:none; }
  #np .top { display:flex; justify-content:space-between; align-items:center; color:var(--mut); font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
  #np .art { flex:1; display:grid; place-items:center; min-height:0; padding:18px 0; }
  #np .art img { width:min(100%, 52vh); aspect-ratio:1; object-fit:cover; border-radius:16px; box-shadow:0 20px 50px rgba(0,0,0,.55); background:var(--s3); }
  #np h2 { font-size:22px; margin:0 0 4px; letter-spacing:-.02em; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  #np .ch { color:var(--mut); margin-bottom:14px; }
  /* seek bars: big thumb and a tall touch area so it is easy to grab with a finger */
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:40px; background:none; margin:0; touch-action:none; cursor:pointer; }
  input[type=range]::-webkit-slider-runnable-track { height:6px; border-radius:3px; background:linear-gradient(to right,var(--acc) var(--p,0%),rgba(255,255,255,.2) var(--p,0%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:26px; height:26px; border-radius:50%; background:#fff; margin-top:-10px; box-shadow:0 2px 8px rgba(0,0,0,.45), 0 0 0 4px rgba(30,215,96,.25); }
  input[type=range]:active::-webkit-slider-thumb { transform:scale(1.15); }
  input[type=range]::-moz-range-track { height:6px; border-radius:3px; background:rgba(255,255,255,.2); }
  input[type=range]::-moz-range-progress { height:6px; border-radius:3px; background:var(--acc); }
  input[type=range]::-moz-range-thumb { width:26px; height:26px; border:0; border-radius:50%; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.45), 0 0 0 4px rgba(30,215,96,.25); }
  .times { display:flex; justify-content:space-between; color:var(--mut); font-size:12px; margin-top:-2px; }
  .ctrls { display:flex; align-items:center; justify-content:center; gap:34px; margin:16px 0 8px; }
  .ctrls .big { width:72px; height:72px; border-radius:50%; background:var(--fg); color:#000; display:grid; place-items:center; }
  .ctrls .big svg { width:30px; height:30px; }
  .ctrls .sm { width:52px; height:52px; display:grid; place-items:center; border-radius:50%; }
  .ctrls .sm svg { width:28px; height:28px; }

  #toast { position:fixed; left:50%; transform:translate(-50%,20px); bottom:calc(var(--bottom) + 16px); background:#f5f5f7; color:#111; padding:10px 18px; border-radius:999px; font-weight:600; font-size:14px; opacity:0; pointer-events:none; transition:.25s; z-index:90; max-width:90vw; box-shadow:0 8px 24px rgba(0,0,0,.4); text-align:center; }
  #toast.on { opacity:1; transform:translate(-50%,0); }

  /* login */
  .login { max-width:360px; margin:9vh auto 0; text-align:center; }
  .login .brand { width:min(64vw,230px); aspect-ratio:1; border-radius:28px; object-fit:cover; display:block; margin:0 auto 16px; box-shadow:0 14px 40px rgba(0,0,0,.45); }
  .login h1 { font-size:28px; letter-spacing:-.03em; margin:0 0 4px; }
  .login p.sub { color:var(--mut); margin:0 0 26px; }
  .login .field { text-align:left; display:grid; gap:14px; }
  .chk { display:flex; align-items:center; gap:10px; color:var(--mut); }
  .chk input { width:20px; height:20px; accent-color:var(--acc); }
  .qr { text-align:center; padding:6px 0 4px; }
  .qr img { width:min(70vw,260px); background:#fff; border-radius:14px; padding:10px; }
  .qr code { display:block; word-break:break-all; color:var(--mut); font-size:12.5px; margin:10px 0 4px; }
  .searchbar .go { width:38px; height:38px; border-radius:50%; background:var(--acc); display:grid; place-items:center; flex:none; margin-right:-6px; }
  .searchbar .go svg { color:var(--acc-ink); width:18px; height:18px; stroke-width:2.6; }
  .hint { color:var(--mut); font-size:12.5px; margin:-4px 4px 12px; }
  /* swipe rows (owner): slide left to reveal actions */
  .row.swipe { display:block; padding:0; overflow:hidden; }
  .row.swipe.cur { background:none; }
  .row.swipe > .rin { display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:8px 6px; background:var(--bg); border-radius:12px; position:relative; z-index:1; transition:transform .22s cubic-bezier(.2,.8,.2,1); touch-action:pan-y; user-select:none; -webkit-user-select:none; }
  .row.swipe.cur > .rin { background:linear-gradient(90deg, rgba(30,215,96,.13), rgba(30,215,96,0)), var(--bg); }
  .sacts { position:absolute; top:0; right:0; bottom:0; display:flex; border-radius:12px; overflow:hidden; }
  .sacts button { width:88px; font-size:11.5px; white-space:nowrap; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:#fff; font-size:12px; font-weight:700; }
  .sacts svg { width:20px; height:20px; }
  .sacts .sp { background:#17a34a; } .sacts .sr { background:#e04848; }
  /* now playing card at the top of the queue */
  .npcard { background:var(--s2); border-radius:16px; padding:12px 12px 8px; margin:0 0 4px; }
  .npcard .top { display:flex; gap:12px; align-items:center; margin-bottom:6px; }
  .npcard .th { width:56px; height:56px; }
  .npcard .times { font-variant-numeric:tabular-nums; }
  /* preview bar */
  #pvbar { position:fixed; left:8px; right:8px; bottom:var(--pvb, calc(var(--nav-h) + var(--safe-b) + 6px)); z-index:32; height:60px; border-radius:14px; background:#3b2a6b; display:none; align-items:center; gap:10px; padding:0 8px; box-shadow:0 8px 28px rgba(0,0,0,.45); max-width:704px; margin:0 auto; }
  #pvbar.on { display:flex; }
  #pvbar .k { color:var(--acc); font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; }
  #pvbar .s { font-variant-numeric:tabular-nums; }
  .pvprog { height:3px; background:rgba(255,255,255,.2); border-radius:2px; margin-top:5px; overflow:hidden; } .pvprog i { display:block; height:100%; width:0; background:var(--acc); }
  @media (min-width:700px) { #mini, #pvbar { left:calc(50% - 352px); right:auto; width:704px; } }
</style>
</head>
<body>
<header class="appbar">
  <div class="logo"><img class="mark" src="/static/avatar.jpg" alt=""><span>coni<b>MIX</b></span></div>
  <div class="actions"><button class="ib" id="qrBtn" aria-label="Jam session"></button><button class="ib" id="outBtn" aria-label="Tanca la sessió"></button></div>
</header>
<div class="jambar" id="jamBar" hidden><span>Ets a la jam com a convidat</span><a class="jbtn" href="/">Accedeix com a amfitrió</a></div>
<main id="main"></main>

<div id="mini"><div class="prog" id="mProg"></div>
  <img class="th" id="mArt" alt=""><div class="mt" id="mInfo"><div class="t" id="mTitle"></div><div class="s" id="mSub"></div></div>
  <button class="rb" id="mPlay" aria-label="Reprodueix / pausa"></button><button class="rb" id="mNext" aria-label="Següent"></button>
</div>
<div id="pvbar"><button class="rb play" id="pvPlay" aria-label="Reprodueix / pausa la prèvia"></button>
  <div class="mt"><div class="k">Prèvia</div><div class="t" id="pvTitle"></div><div class="pvprog"><i id="pvProg"></i></div></div>
  <span class="s" id="pvTime"></span><button class="rb" id="pvClose" aria-label="Tanca la prèvia"></button></div>
<nav id="nav"></nav>

<section id="np" aria-hidden="true">
  <div class="top"><button class="ib" id="npClose" aria-label="Tanca"></button><span>Ara sona</span><span style="width:42px"></span></div>
  <div class="art"><img id="npArt" alt=""></div>
  <h2 id="npTitle"></h2><div class="ch" id="npSub"></div>
  <input type="range" id="seek" min="0" max="1000" value="0">
  <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
  <div class="ctrls"><button class="sm" id="npQueue" aria-label="Cua"></button><button class="big" id="npPlay" aria-label="Reprodueix / pausa"></button><button class="sm" id="npNext" aria-label="Següent"></button></div>
</section>

<div id="backdrop"></div><div id="sheet" role="dialog"></div>
<div id="toast"></div>
<video id="ns" muted loop playsinline src="/static/nosleep.mp4" style="position:fixed;width:1px;height:1px;opacity:.01;pointer-events:none;left:0;top:0"></video>
<audio id="audio" preload="auto"></audio><audio id="audio2" preload="auto"></audio><audio id="pv" preload="auto"></audio>

<script>
const GUEST = location.pathname.startsWith('/jam');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => { if (!s && s !== 0) return ''; s = Math.round(s); const h = s/3600|0, m = (s%3600)/60|0, x = s%60;
  return (h ? h+':'+String(m).padStart(2,'0') : m)+':'+String(x).padStart(2,'0'); };
const fmtLong = s => { if (s < 60) return `${Math.round(s)} s`; const m = Math.round(s/60); return m >= 60 ? `${m/60|0} h ${m%60} min` : `${m} min`; };

// ---------- icons ----------
const P = {

const FILLED = new Set(['play','pause','next','grip','more']);
const I = (n, cls='') => `<svg class="ic ${FILLED.has(n)?'f ':''}${cls}" viewBox="0 0 24 24">${P[n]}</svg>`;

// ---------- state ----------
let S = {songs:{}, playlists:[], queue:[], current:null, jam_url:''}, lastSig = '', dragging = false;
let RS = {}, LQ = '', viewKey = '', swipeOpen = null, pvWait = null;   // RS: download status of search results
let tab = 'queue', openPl = null;   // guests also land on the queue
const SQ = {q:'', res:[], loading:false, err:''};   // search tab
const PQ = {q:'', res:[], loading:false, err:''};   // search inside a playlist
const TABS = GUEST ? [['search','Cerca','search'],['queue','Cua','queue']] : [['search','Cerca','search'],['queue','Cua','queue'],['lists','Llistes','lists']];

// ---------- api / toast ----------
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2600); }
async function api(path, method = 'GET', body) {
  const r = await fetch(path, {method, headers:{'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && !GUEST && path !== '/api/login') { showLogin(); throw new Error('login'); }
  if (r.status === 401 && GUEST) { showJamLocked(j.error); throw new Error('jam'); }
  if (!r.ok) { toast(j.error || 'Error'); throw new Error(j.error); }
  return j;
}
async function act(path, method, body) { try { const r = await api(path, method, body); lastSig = ''; await poll(); return r; } catch { lastSig = ''; await poll(); return null; } }
let pollSeq = 0;
async function poll() {
  const my = ++pollSeq; let st, rs = RS;
  try { const r = await fetch('/api/state', {cache:'no-store'}); if (r.status === 401) { if (GUEST) showJamLocked("La jam s'ha tancat o el codi ha canviat. Torna a escanejar el QR."); else showLogin(); return; } st = await r.json(); } catch { return; }
  const ids = [...new Set([...SQ.res, ...PQ.res].map(r => r.id))];
  if (ids.length) { try { rs = await (await fetch('/api/songs?ids=' + ids.join(','), {cache:'no-store'})).json(); } catch {} }
  if (my !== pollSeq) return;
  const sig = JSON.stringify([st, rs]);
  if (sig === lastSig) return; lastSig = sig; S = st; RS = rs;
  if (pvWait && statusOf(pvWait.id)?.status === 'ready') { toast(`«${pvWait.title.slice(0, 40)}» ja es pot escoltar`); pvWait = null; }
  syncPlayer(); if (!dragging && !seeking && !swipeOpen) render();
}
const statusOf = id => S.songs[id] || RS[id];

// ---------- sheets ----------
let sheetDone = null;
function openSheet(html) { $('#sheet').innerHTML = `<div class="grab"></div>${html}`; $('#backdrop').classList.add('on'); $('#sheet').classList.add('on'); }
function closeSheet(v = null) { $('#backdrop').classList.remove('on'); $('#sheet').classList.remove('on'); const d = sheetDone; sheetDone = null; if (d) d(v); }
$('#backdrop').onclick = () => closeSheet(null);
$('#sheet').onclick = e => { const o = e.target.closest('[data-v]'); if (o) closeSheet(o.dataset.v); };
function menu({title, sub, thumb, items}) {
  return new Promise(res => {
    sheetDone = res;
    openSheet(`${title ? `<div class="shead">${thumb ? `<img class="th" src="${esc(thumb)}" alt="" onerror="this.style.display='none'">` : ''}<div class="mt"><div class="t">${esc(title)}</div>${sub ? `<div class="s">${esc(sub)}</div>` : ''}</div></div>` : ''}
      ${items.map(o => `<button class="opt ${o.danger?'dng':''}" data-v="${esc(o.v)}">${I(o.icon||'right')}<span>${esc(o.label)}${o.sub ? `<small>${esc(o.sub)}</small>` : ''}</span></button>`).join('')}`);
  });
}
function ask({title, text, ok = 'Confirma', danger}) {
  return new Promise(res => {
    sheetDone = v => res(v === 'ok');
    openSheet(`<h3>${esc(title)}</h3><p>${esc(text || '')}</p><div class="btnrow"><button class="btn" data-v="">Cancel·la</button><button class="btn ${danger?'dng':'pri'}" data-v="ok">${esc(ok)}</button></div>`);
  });
}
function input({title, value = '', ok = 'Desa', ph = ''}) {
  return new Promise(res => {
    sheetDone = res;
    openSheet(`<h3>${esc(title)}</h3><input class="sinput" id="sin" value="${esc(value)}" placeholder="${esc(ph)}" maxlength="80" enterkeyhint="done"><div class="btnrow"><button class="btn" data-v="">Cancel·la</button><button class="btn pri" id="sok">${esc(ok)}</button></div>`);
    const f = () => { const v = $('#sin').value.trim(); closeSheet(v || null); };
    $('#sok').onclick = f; $('#sin').onkeydown = e => { if (e.key === 'Enter') f(); };
    setTimeout(() => { $('#sin').focus(); $('#sin').select(); }, 260);
  });
}
async function pickPlaylist(title = 'Afegeix a una llista') {
  const items = S.playlists.map(p => ({v:'p'+p.id, icon:'lists', label:p.name, sub:`${p.songs.length} cançons`})).concat([{v:'new', icon:'plus', label:'Nova llista…'}]);
  const v = await menu({title, items}); if (!v) return null;
  if (v === 'new') { const name = await input({title:'Nova llista', ph:'Nom de la llista', ok:'Crea'}); if (!name) return null; return (await api('/api/playlists','POST',{name})).id; }
  return +v.slice(1);
}

// ---------- views ----------
const hasCurrent = () => S.current != null;
const thumbOf = id => `/media/${id}.jpg`;
const thumbImg = (id, cls = 'th') => `<img class="${cls}" src="${thumbOf(id)}" alt="" loading="lazy" onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${id}/mqdefault.jpg'">`;
function statusBits(s) {
  if (!s) return {sub:'', bar:''};
  if (s.status === 'downloading') return {sub:`<span>Descarregant ${Math.round(s.progress)}%</span>`, bar:`<div class="bar"><i style="width:${s.progress}%"></i></div>`};
  if (s.status === 'error') return {sub:`<span class="er">No s'ha pogut descarregar</span>`, bar:''};
  return {sub:`<span class="ok">${I('check')}Descarregada</span>`, bar:''};
}
function empty(icon, title, text) { return `<div class="empty">${I(icon)}<b>${title}</b>${text}</div>`; }
function searchBox(ctx, q, ph, go = true) {
  return `<form class="searchbar" data-ctx="${ctx}">${go ? '' : I('search')}<input type="search" data-keep="q-${ctx}" placeholder="${ph}" value="${esc(q)}" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button type="button" class="x" data-act="sclear" data-ctx="${ctx}" aria-label="Esborra" ${q ? '' : 'hidden'}>${I('x')}</button>${go ? `<button type="submit" class="go" aria-label="Cerca">${I('search')}</button>` : ''}</form>`;
}
function resultRows(st, ctx, pl) {
  if (st.loading && !st.res.length) return '<div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  if (st.err && !st.res.length) return `<div class="note" style="color:var(--danger)">${esc(st.err)}</div>`;
  return `${st.loading ? `<div class="hint">Cercant «${esc(st.q.trim())}»…</div>` : ''}<div class="list">${st.res.map((r, i) => {
    const s = statusOf(r.id); const sb = s ? statusBits(s) : null;
    const inList = ctx === 'pl' && pl && pl.songs.includes(r.id);
    const playingPv = pvR && pvR.id === r.id && !pv.paused;
    const pvBtn = `<button class="rb ${playingPv ? 'play' : ''}" data-act="rprev" data-ctx="${ctx}" data-i="${i}" aria-label="Escolta una prèvia">${I(playingPv ? 'pause' : 'head')}</button>`;
    let right;
    if (ctx === 'pl') right = pvBtn + (inList ? `<span class="rb done">${I('check')}</span>` : `<button class="rb add" data-act="pladdres" data-i="${i}" aria-label="Afegeix a la llista">${I('plus')}</button>`);
    else right = pvBtn + (GUEST ? `<button class="rb add" data-act="rmore" data-i="${i}" aria-label="Afegeix a la cua">${I('plus')}</button>`
      : `<button class="rb" data-act="rmore" data-i="${i}" aria-label="Opcions: reprodueix, cua, llista">${I('more')}</button>`);
    const act = ctx === 'pl' ? (inList ? '' : 'pladdres') : 'rmore';
    return `<div class="row" ${act ? `data-act="${act}" data-i="${i}"` : ''}>
      <img class="th" src="${esc(r.thumbnail)}" alt="" loading="lazy"><div class="mt"><div class="t">${esc(r.title)}</div><div class="s"><span>${esc(r.channel)}${r.duration ? ' · ' + fmt(r.duration) : ''}</span></div>${sb ? `<div class="s">${sb.sub}</div>` : ''}</div>${right}${sb ? sb.bar : ''}</div>`;
  }).join('')}</div>`;
}

const SEARCH_HINT = '<div class="hint">Cerca a YouTube i YouTube Music. Comença sola a partir de 5 lletres. Toca <b>🎧</b> per escoltar-ne una prèvia.</div>';
function viewSearch() {
  const body = SQ.loading || SQ.err || SQ.res.length ? resultRows(SQ, 'main') : empty('search', 'Cerca música', GUEST ? 'Troba una cançó, escolta-la i afegeix-la a la cua.' : "Escriu el nom d'una cançó o d'un artista.<br>Només sona quan la descàrrega és al 100%.");
  return {key:'search', pre:`<h1 class="title">${GUEST ? 'Jam session' : 'Cerca'}</h1>`, box: searchBox('main', SQ.q, 'Cançons, artistes o vídeos') + SEARCH_HINT, post: body};
}

function qRow(q, idx) {
  const s = S.songs[q.song_id] || {}; const ready = s.status === 'ready'; const cur = q.qid === S.current; const sb = statusBits(s);
  const inner = `${thumbImg(q.song_id)}<div class="mt"><div class="t">${esc(s.title)}</div>
    <div class="s">${cur ? `<span class="eq ${audio.paused ? 'paused' : ''}"><i></i><i></i><i></i></span>` : ''}<span>${esc(s.channel)}</span>${ready ? '' : sb.sub}</div></div>
    ${GUEST ? '' : `<button class="rb" data-act="qmore" data-qid="${q.qid}" aria-label="Més opcions">${I('more')}</button>`}
    ${idx <= curIdx() ? `<span class="rb" style="opacity:.18" title="Està sonant: no es pot moure">${I('grip')}</span>` : `<button class="rb grip" aria-label="Arrossega per canviar l'ordre">${I('grip')}</button>`}${ready ? '' : sb.bar}`;
  const cls = `${cur ? 'cur' : ''} ${ready ? '' : 'dim'}`;
  if (GUEST) return `<div class="row ${cls}" data-sid="${q.qid}">${inner}</div>`;
  const acts = `${ready && !cur ? `<button class="sp" data-act="swplay" data-qid="${q.qid}">${I('play')}Reprodueix</button>` : ''}<button class="sr" data-act="swrm" data-qid="${q.qid}">${I('trash')}Treu</button>`;
  return `<div class="row swipe ${cls}" data-sid="${q.qid}"><div class="sacts">${acts}</div><div class="rin" ${ready ? `data-act="qplay" data-qid="${q.qid}"` : ''}>${inner}</div></div>`;
}
function npCard() {   // what is playing, with remaining time and a seek bar, right in the queue
  const s = songOfQ(S.current); if (!s || GUEST) return '';
  const d = audio.duration || s.duration || 0, c = audio.currentTime || 0, p = d ? c / d * 100 : 0;
  return `<div class="npcard"><div class="top">${thumbImg(s.id)}<div class="mt"><div class="t">${esc(s.title)}</div><div class="s">${esc(s.channel)}</div></div>
    <button class="rb play" data-act="nptoggle" aria-label="Reprodueix / pausa">${I(audio.paused ? 'play' : 'pause')}</button><button class="rb" data-act="npnext" aria-label="Següent">${I('next')}</button></div>
    <input type="range" id="qSeek" min="0" max="1000" value="${Math.round(p * 10)}" style="--p:${p}%" aria-label="Posició de la cançó">
    <div class="times"><span id="qCur">${fmt(c)}</span><span id="qRem">-${fmt(Math.max(0, d - c))}</span></div></div>`;
}
const curIdx = () => S.queue.findIndex(q => q.qid === S.current);
function viewQueue() {
  const n = S.queue.length;
  return {key:'queue', pre:`<h1 class="title">Cua</h1>${npCard()}
    <div class="sec"><span>${n} ${n === 1 ? 'cançó' : 'cançons'}</span>${GUEST || !n ? '' : '<button class="link dng" data-act="qclear">Buida la cua</button>'}</div>
    ${GUEST || !n ? '' : '<div class="hint">Llisca una cançó cap a l\'esquerra per reproduir-la o treure-la</div>'}
    ${n ? `<div class="list sortlist" data-kind="queue">${S.queue.map((q, i) => qRow(q, i)).join('')}</div>` : empty('queue', 'La cua és buida', 'Cerca una cançó o carrega una llista.')}`};
}

const orphans = () => Object.values(S.songs).filter(s => s.status !== 'error' && !S.playlists.some(p => p.songs.includes(s.id)));
const firstReady = pl => pl.songs.find(id => S.songs[id]?.status === 'ready');
function viewLists() {
  if (openPl === 'orphans') return viewOrphans();
  const pl = S.playlists.find(p => p.id === openPl);
  if (pl) return viewPlaylist(pl);
  openPl = null;
  const orph = orphans(), many = S.playlists.length >= 2;
  const norm = x => x.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const shown = S.playlists.filter(p => !LQ.trim() || norm(p.name).includes(norm(LQ.trim())));
  return {key:'lists' + (many ? '+f' : ''), pre:`<h1 class="title">Llistes</h1>
    <button class="btn pri block" data-act="plnew" style="margin-bottom:12px">${I('plus')}Nova llista</button>`,
    box: many ? searchBox('lf', LQ, 'Cerca una llista', false) : '',
    post:`<div class="list">${shown.map(p => { const c = firstReady(p); return `<button class="pcard" data-act="plopen" data-id="${p.id}"><div class="cover">${c ? thumbImg(c, '') : I('music')}</div><div class="mt"><div class="t">${esc(p.name)}</div><div class="s">${p.songs.length} ${p.songs.length === 1 ? 'cançó' : 'cançons'}</div></div>${I('right')}</button>`; }).join('')}
    ${LQ.trim() && !shown.length ? '<div class="empty" style="padding:20px">Cap llista coincideix</div>' : ''}
    ${orph.length && !LQ.trim() ? `<button class="pcard" data-act="plorph"><div class="cover">${I('folder')}</div><div class="mt"><div class="t">Sense llista</div><div class="s">${orph.length} ${orph.length === 1 ? 'cançó descarregada' : 'cançons descarregades'}</div></div>${I('right')}</button>` : ''}</div>
    ${S.playlists.length || orph.length ? '' : empty('lists', 'Cap llista encara', 'Crea la primera i afegeix-hi cançons cercant-les.')}`};
}
function viewPlaylist(pl) {
  const total = pl.songs.reduce((a, id) => a + (S.songs[id]?.duration || 0), 0);
  const ready = pl.songs.filter(id => S.songs[id]?.status === 'ready').length;
  const rows = pl.songs.map(id => {
    const s = S.songs[id] || {}; const sb = statusBits(s); const isReady = s.status === 'ready';
    const acts = `${isReady ? `<button class="sp" data-act="pswplay" data-id="${id}">${I('play')}Reprodueix</button>` : ''}<button class="sr" data-act="pswrm" data-id="${id}">${I('trash')}Treu</button>`;
    return `<div class="row swipe ${isReady ? '' : 'dim'}" data-sid="${id}"><div class="sacts">${acts}</div><div class="rin">${thumbImg(id)}<div class="mt"><div class="t">${esc(s.title)}</div>
      <div class="s"><span>${esc(s.channel)} · ${fmt(s.duration)}</span>${isReady ? '' : sb.sub}</div></div>
      <button class="rb" data-act="pmore" data-id="${id}" aria-label="Més opcions">${I('more')}</button>
      <button class="rb grip" aria-label="Arrossega per canviar l'ordre">${I('grip')}</button>${isReady ? '' : sb.bar}</div></div>`;
  }).join('');
  const searching = PQ.loading || PQ.err || PQ.res.length; const c = firstReady(pl);
  return {key:'pl' + pl.id, pre:`<button class="back" data-act="plback">${I('left')}Llistes</button>
    <div class="phead"><div class="cover big">${c ? thumbImg(c, '') : I('music')}</div>
      <div class="mt"><h1>${esc(pl.name)}</h1><div class="s">${pl.songs.length} ${pl.songs.length === 1 ? 'cançó' : 'cançons'}${total ? ' · ' + fmtLong(total) : ''}</div></div>
      <button class="rb" data-act="plmenu" aria-label="Opcions de la llista">${I('more')}</button></div>
    <div class="btnrow"><button class="btn pri" data-act="plplay" ${ready ? '' : 'disabled'}>${I('play')}Reprodueix</button><button class="btn" data-act="pladdq" ${pl.songs.length ? '' : 'disabled'}>${I('queue')}A la cua</button></div>
    <div class="sec"><span>Afegeix cançons</span></div>`,
    box: searchBox('pl', PQ.q, 'Cerca una cançó per afegir-la a la llista'),
    post:`${searching ? `<div class="sec"><span>Resultats</span><button class="link" data-act="sclear" data-ctx="pl">Tanca</button></div>${resultRows(PQ, 'pl', pl)}` : ''}
    <div class="sec"><span>Cançons de la llista</span></div>
    ${pl.songs.length ? `<div class="list sortlist" data-kind="pl" data-pid="${pl.id}">${rows}</div>` : empty('music', 'Llista buida', 'Cerca una cançó a dalt i quedarà al final de la llista.')}`};
}
function viewOrphans() {
  const orph = orphans();
  return {key:'orph', pre:`<button class="back" data-act="plback">${I('left')}Llistes</button><h1 class="title">Sense llista</h1>
    <div class="note">Cançons descarregades que no són a cap llista. Afegeix-les a una llista o esborra-les per alliberar espai.</div>
    ${orph.length ? `<div class="list">${orph.map(s => { const sb = statusBits(s); return `<div class="row">${thumbImg(s.id)}<div class="mt"><div class="t">${esc(s.title)}</div><div class="s"><span>${esc(s.channel)} · ${fmt(s.duration)}</span>${s.status === 'ready' ? '' : sb.sub}</div></div>
      <button class="rb" data-act="omore" data-id="${s.id}" aria-label="Més opcions">${I('more')}</button>${s.status === 'ready' ? '' : sb.bar}</div>`; }).join('')}</div>` : empty('check', 'Tot en ordre', 'Totes les cançons són a alguna llista.')}`};
}

function renderNav() {
  const qn = S.queue.length;
  $('#nav').innerHTML = TABS.map(([k, label, icon]) => `<button data-tab="${k}" class="${tab === k ? 'on' : ''}" aria-label="${label}">${I(icon)}${k === 'queue' && qn ? `<span class="badge">${qn}</span>` : ''}<span>${label}</span></button>`).join('');
}
// The search box is only rebuilt when the view changes, so typing (and the phone keyboard) is never interrupted.
function render() {
  if (document.body.dataset.login) return;
  const v = tab === 'search' ? viewSearch() : tab === 'queue' ? viewQueue() : viewLists();
  if (v.key !== viewKey) { viewKey = v.key; $('#main').innerHTML = `<div id="vpre"></div><div id="vbox">${v.box || ''}</div><div id="vpost"></div>`; }
  $('#vpre').innerHTML = v.pre || ''; $('#vpost').innerHTML = v.post || '';
  renderNav(); renderPlayer();
}

// ---------- search ----------
async function runSearch(ctx, q) {
  const st = ctx === 'pl' ? PQ : SQ;
  if (!q) { st.res = []; st.err = ''; st.last = ''; return render(); }
  if (q === st.last && st.res.length && !st.err) return;
  const my = st.seq = (st.seq || 0) + 1; st.loading = true; st.err = ''; render();
  let res = st.res, err = '';
  try { res = await api('/api/search?q=' + encodeURIComponent(q)); if (!res.length) err = 'Cap resultat'; } catch (e) { err = e.message || 'Error de cerca'; }
  if (my !== st.seq) return;   // a newer search already started
  st.loading = false; st.res = err ? [] : res; st.err = err; st.last = q; lastSig = ''; render(); poll();
}
const searchTimers = {};
document.addEventListener('submit', e => {
  const f = e.target.closest('.searchbar'); if (!f) return; e.preventDefault();
  const inp = f.querySelector('input'); inp.blur(); if (f.dataset.ctx === 'lf') return;

  el.addEventListener('error', () => { if (el === audio && loaded != null && el.getAttribute('src') && el.getAttribute('src') !== SILENT) { toast('No es pot reproduir aquesta cançó, la salto'); act('/api/queue/next', 'POST', {from: loaded}); } });
  el.addEventListener('play', () => { if (el !== audio) return; if (pvR) stopPreview(); renderPlayer(); const b = $('[data-act=nptoggle]'); if (b) b.innerHTML = I('pause'); requestAwake(); document.querySelectorAll('.eq').forEach(x => x.classList.remove('paused')); });
  el.addEventListener('pause', () => { if (el !== audio) return; if (fadeState) fadeState.old.pause(); renderPlayer(); const b = $('[data-act=nptoggle]'); if (b) b.innerHTML = I('play'); if (!el.ended) releaseAwake(); document.querySelectorAll('.eq').forEach(x => x.classList.add('paused')); });
}
async function requestAwake() {   // keep the phone awake while playing
  if ('wakeLock' in navigator) { try { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => wl = null); return; } catch {} }
  $('#ns').play().catch(() => {});   // plain http fallback: silent looping video
}
function releaseAwake() { try { wl?.release(); } catch {} wl = null; $('#ns').pause(); }
document.addEventListener('visibilitychange', () => { if (!document.hidden && !audio.paused) requestAwake(); });
if ('mediaSession' in navigator && !GUEST) {
  navigator.mediaSession.setActionHandler('play', () => audio.play()); navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('nexttrack', skip);
}

// ---------- preview: listen to a search result on this device before adding it ----------
const pv = $('#pv'); let pvR = null;
function stopPreview() { pv.pause(); pv.removeAttribute('src'); pvR = null; renderPlayer(); lastSig = ''; render(); }
async function previewResult(r) {
  if (!r) return;
  if (pvR && pvR.id === r.id) { if (pv.paused) pv.play(); else pv.pause(); return; }
  if (!GUEST && !audio.paused) return toast('Atura la cua per escoltar una prèvia');
  const s = statusOf(r.id);
  if (!s || s.status === 'error') {
    try { await api('/api/prefetch', 'POST', metaOf(r)); pvWait = r; toast("Descarregant-la… t'avisaré quan la puguis escoltar"); } catch {}
    lastSig = ''; poll(); return;
  }
  if (s.status !== 'ready') { pvWait = r; return toast(`Encara es descarrega (${Math.round(s.progress)}%)`); }
  pvR = r; pv.src = `/media/${r.id}.mp3`; pv.play().catch(() => toast("No s'ha pogut reproduir la prèvia")); renderPlayer();
}
pv.addEventListener('play', () => { renderPlayer(); lastSig = ''; render(); });
pv.addEventListener('pause', () => { if (!pvR) return; renderPlayer(); lastSig = ''; render(); });
pv.addEventListener('ended', stopPreview);
pv.addEventListener('timeupdate', () => { if (!pv.duration) return; $('#pvProg').style.width = (pv.currentTime / pv.duration * 100) + '%'; $('#pvTime').textContent = fmt(pv.currentTime) + ' / ' + fmt(pv.duration); });
$('#pvPlay').onclick = () => { if (!GUEST && !audio.paused && pv.paused) return toast('Atura la cua per escoltar una prèvia'); pv.paused ? pv.play() : pv.pause(); };
$('#pvClose').onclick = stopPreview;

// ---------- login / boot ----------
let timer = null;
function showLogin() {
  clearInterval(timer); document.body.dataset.login = '1'; audio.pause();
  ['#mini', '#nav'].forEach(s => $(s).style.display = 'none'); $('#qrBtn').hidden = $('#outBtn').hidden = true;
  $('#main').innerHTML = `<form class="login" id="lf"><img class="brand" src="/static/logo.jpg" alt="coniMIX"><p class="sub">Inicia la sessió per gestionar la teva música</p>
    <div class="field"><input type="text" value="propietari" autocomplete="username" hidden>
    <div class="searchbar" style="margin:0"><input type="password" id="pw" placeholder="Contrasenya" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required><button type="button" class="x" id="eye" aria-label="Mostra la contrasenya" style="width:40px;height:40px">${I('eye')}</button></div>
    <label class="chk"><input type="checkbox" id="rem" checked><span>Recorda'm en aquest dispositiu</span></label>
    <button class="btn pri block">Entra</button><div id="lerr" class="s" style="color:var(--danger);justify-content:center;white-space:normal"></div>
    <p class="s" style="justify-content:center;white-space:normal;margin:6px 0 0">Per afegir cançons a la festa, escaneja el codi QR de l'amfitrió.</p></div></form>`;
  $('#eye').onclick = () => { const i = $('#pw'); i.type = i.type === 'password' ? 'text' : 'password'; };
  $('#lf').onsubmit = async e => {
    e.preventDefault(); $('#lerr').textContent = '';
    const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:$('#pw').value, remember:$('#rem').checked})});
    if (r.ok) location.reload(); else $('#lerr').textContent = (await r.json().catch(() => ({}))).error || 'Error';
  };
}
function showJamLocked(msg) {
  clearInterval(timer); document.body.dataset.login = '1'; pv.pause();
  ['#mini', '#nav', '#pvbar'].forEach(s => $(s).style.display = 'none'); $('#jamBar').hidden = true;
  $('#main').innerHTML = `<div class="login"><img class="brand" src="/static/logo.jpg" alt="coniMIX">
    <h1 style="font-size:24px">Benvingut a la jam!</h1><p class="sub">${esc(msg || "Per entrar-hi, escaneja amb la càmera el codi QR que et mostrarà l'amfitrió.")}</p>
    <a class="btn block" href="/" style="text-decoration:none">Sóc l'amfitrió</a></div>`;
}
(async () => {
  if (GUEST) {
    const k = new URLSearchParams(location.search).get('k'); let joinErr = '';
    if (k) {
      const r = await fetch('/api/jam/join', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({k})});
      if (!r.ok) joinErr = (await r.json().catch(() => ({}))).error || '';
      history.replaceState(null, '', '/jam');   // the code is not kept in the address bar
    }
    const me = await (await fetch('/api/me')).json().catch(() => ({}));
    if (!me.guest) return showJamLocked(joinErr);
  }
  if (!GUEST) { const me = await (await fetch('/api/me')).json().catch(() => ({})); if (!me.owner) return showLogin(); }
  render(); await poll(); timer = setInterval(poll, 1500);
})();
</script>
</body>
