<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="coniMIX">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<title>coniMIX</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0b0b0d; --s1:#141417; --s2:#1c1c21; --s3:#26262d; --line:rgba(255,255,255,.08);
    --fg:#f5f5f7; --mut:#9a9aa6; --acc:#1ed760; --acc-ink:#04210e; --danger:#ff6b6b;
    --nav-h:58px; --mini-h:64px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
    --bottom:calc(var(--nav-h) + var(--safe-b));
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif; overscroll-behavior-y:none; }
  [hidden] { display:none !important; }
  button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; padding:0; }
  button:disabled { opacity:.4; cursor:default; }
  input { font:inherit; color:inherit; }
  svg.ic { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  svg.ic.f { fill:currentColor; }
  .link svg.ic.sm { width:15px; height:15px; vertical-align:-2px; margin-right:4px; }

  /* app bar */
  .appbar { position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; padding:calc(10px + var(--safe-t)) 16px 10px; background:rgba(11,11,13,.82); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border-bottom:1px solid var(--line); }
  .logo { display:flex; align-items:center; gap:10px; font-weight:800; font-size:19px; letter-spacing:-.02em; }
  .logo .mark { width:36px; height:36px; border-radius:50%; object-fit:cover; background:#fff; box-shadow:0 0 0 2px var(--acc); }
  .logo b { background:linear-gradient(90deg,#29b6ff,#7ed957,#ff8a2b); -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:900; }
  .actions { display:flex; gap:4px; }
  .ib { width:42px; height:42px; border-radius:50%; display:grid; place-items:center; color:var(--fg); }
  .ib:active, .rb:active { background:var(--s3); }

  /* jam (guest) look: indigo + pink so it is obvious you are not the host */
  :root[data-mode=jam] { --bg:#0f0a1f; --s1:#171030; --s2:#20173f; --s3:#2e2358; --acc:#ff6bd6; --acc-ink:#2b0626; --line:rgba(255,255,255,.1); }
  :root[data-mode=jam] body { background:radial-gradient(1200px 500px at 50% -10%, #2a1458 0%, var(--bg) 60%) fixed; }
  :root[data-mode=jam] .appbar { background:rgba(15,10,31,.82); }
  :root[data-mode=jam] .row { background:transparent; }
  .jambar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 16px; background:linear-gradient(90deg,#3a1b73,#6a1f66); border-bottom:1px solid var(--line); font-size:13px; }
  .jambar span { color:#f0e6ff; line-height:1.25; }
  .jambar.offbar { background:linear-gradient(90deg,#3d2a0e,#5c3b10); }
  .jambar .jbtn { flex:none; background:var(--acc); color:var(--acc-ink); font-weight:700; padding:8px 14px; border-radius:999px; text-decoration:none; font-size:13px; white-space:nowrap; }
  main { max-width:720px; margin:0 auto; padding:6px 16px calc(var(--bottom) + 28px); min-height:70vh; }
  h1.title { font-size:30px; font-weight:800; letter-spacing:-.03em; margin:14px 0 14px; }
  .sec { display:flex; align-items:center; justify-content:space-between; margin:22px 0 8px; color:var(--mut); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; }
  .link { color:var(--acc); font-weight:600; font-size:14px; text-transform:none; letter-spacing:0; padding:6px 0 6px 12px; }
  .link.dng { color:var(--danger); }

  /* search box */
  .searchbar { display:flex; align-items:center; gap:10px; background:var(--s2); border-radius:14px; padding:0 14px; height:50px; border:1px solid transparent; margin-bottom:12px; }
  .searchbar:focus-within { border-color:var(--acc); background:var(--s1); }
  .searchbar svg { color:var(--mut); }
  .searchbar input { flex:1; min-width:0; background:none; border:0; outline:0; height:100%; font-size:16px; }
  .searchbar input::placeholder { color:var(--mut); }
  .searchbar input::-webkit-search-cancel-button, .searchbar input::-webkit-search-decoration { -webkit-appearance:none; appearance:none; display:none; }
  .searchbar .x { width:30px; height:30px; display:grid; place-items:center; color:var(--mut); }

  /* rows */
  .list { display:flex; flex-direction:column; gap:2px; position:relative; }
  .row { display:flex; align-items:center; gap:12px; padding:8px 6px; border-radius:12px; position:relative; background:var(--bg); flex-wrap:wrap; }
  .row[data-act]:active { background:var(--s2); }
  .row.cur { background:linear-gradient(90deg, rgba(30,215,96,.13), rgba(30,215,96,0)); }
  .row.dim .th, .row.dim .mt .t { opacity:.55; }
  .row.drag { z-index:5; background:var(--s3); box-shadow:0 10px 30px rgba(0,0,0,.5); transition:none !important; }
  .list.sorting .row:not(.drag) { transition:transform .16s ease; }
  .th { width:50px; height:50px; border-radius:8px; object-fit:cover; background:var(--s3); flex:none; }
  .mt { flex:1; min-width:0; }
  .t { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row.cur .t { color:var(--acc); }
  .s { color:var(--mut); font-size:13px; margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; gap:6px; align-items:center; }
  .s .ok { color:var(--acc); display:inline-flex; align-items:center; gap:3px; }
  .s .ok svg { width:13px; height:13px; stroke-width:3; }
  .s .er { color:var(--danger); white-space:normal; }
  .s .wt { color:#f5b544; white-space:normal; }
  .note.fail { color:var(--fg); }
  .note.fail b { display:block; } .note.fail span { color:var(--mut); }
  .note.fail .btnrow { margin:10px 0 0; } .note.fail .btn { height:38px; font-size:14px; }
  .rb { width:40px; height:40px; border-radius:50%; display:grid; place-items:center; color:var(--mut); flex:none; }
  .rb.play { background:var(--acc); color:var(--acc-ink); }
  .rb.add { background:var(--s3); color:var(--fg); }
  .rb.done { color:var(--acc); }
  .grip { touch-action:none; cursor:grab; width:36px; }
  .bar { height:3px; border-radius:2px; background:var(--s3); overflow:hidden; width:100%; margin:0 0 2px; order:9; }
  .bar i { display:block; height:100%; background:var(--acc); transition:width .4s; }
  .eq { display:inline-flex; gap:2px; align-items:flex-end; height:13px; margin-right:2px; }
  .eq i { width:3px; background:var(--acc); border-radius:1px; animation:eq 1s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay:.2s; } .eq i:nth-child(3) { animation-delay:.4s; }
  .eq.paused i { animation-play-state:paused; }
  @keyframes eq { 0%,100% { height:3px } 50% { height:13px } }

  /* buttons */
  .btn { height:44px; padding:0 16px; white-space:nowrap; border-radius:999px; background:var(--s3); font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
  .btn.pri { background:var(--acc); color:var(--acc-ink); }
  .btn.block { width:100%; }
  .btn.dng { color:var(--danger); }
  .btnrow { display:flex; gap:10px; margin:6px 0 4px; }
  .btnrow .btn { flex:1; }

  /* cards */
  .pcard { display:flex; align-items:center; gap:14px; padding:10px 6px; border-radius:14px; width:100%; text-align:left; }
  .pcard:active { background:var(--s2); }
  .cover { width:58px; height:58px; border-radius:10px; background:var(--s3); display:grid; place-items:center; color:var(--mut); overflow:hidden; flex:none; }
  .cover img { width:100%; height:100%; object-fit:cover; }
  .cover.big { width:112px; height:112px; border-radius:14px; }
  .phead { display:flex; gap:16px; align-items:center; margin:2px 0 16px; }
  .phead h1 { margin:0 0 4px; font-size:26px; letter-spacing:-.03em; line-height:1.1; word-break:break-word; }
  .back { display:inline-flex; align-items:center; gap:2px; color:var(--acc); font-weight:600; padding:6px 8px 6px 0; margin-top:8px; }
  .back svg { width:20px; height:20px; }
  .empty { text-align:center; color:var(--mut); padding:46px 20px; }
  .empty svg { width:44px; height:44px; opacity:.5; margin-bottom:10px; }
  .empty b { display:block; color:var(--fg); font-size:17px; margin-bottom:4px; }
  .skel { height:66px; border-radius:12px; margin:4px 0; background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1)); background-size:200% 100%; animation:sh 1.2s linear infinite; }
  @keyframes sh { to { background-position:-200% 0 } }
  .note { background:var(--s2); border-radius:12px; padding:10px 14px; color:var(--mut); font-size:13px; margin-bottom:12px; }

  /* bottom: mini player + nav */
  #mini { position:fixed; left:8px; right:8px; bottom:calc(var(--nav-h) + var(--safe-b) + 6px); z-index:30; height:var(--mini-h); border-radius:14px; background:var(--s3); display:none; align-items:center; gap:10px; padding:0 8px; box-shadow:0 8px 28px rgba(0,0,0,.45); overflow:hidden; max-width:704px; margin:0 auto; }
  #mini.on { display:flex; }
  #mini .th { width:46px; height:46px; }
  #mini .mt { cursor:pointer; }
  #mini .prog { position:absolute; left:0; bottom:0; height:2px; background:var(--acc); width:0; }
  nav { position:fixed; left:0; right:0; bottom:0; z-index:25; height:calc(var(--nav-h) + var(--safe-b)); padding-bottom:var(--safe-b); display:flex; background:rgba(14,14,16,.92); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border-top:1px solid var(--line); }
  nav button { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--mut); font-size:11px; font-weight:600; position:relative; }
  nav button.on { color:var(--acc); }
  nav .badge { position:absolute; top:6px; left:calc(50% + 6px); background:var(--acc); color:var(--acc-ink); border-radius:9px; min-width:17px; height:17px; font-size:10px; display:grid; place-items:center; padding:0 4px; }

  /* sheets */
  #backdrop { position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.55); opacity:0; pointer-events:none; transition:opacity .2s; }
  #backdrop.on { opacity:1; pointer-events:auto; }
  #sheet { position:fixed; left:0; right:0; bottom:0; z-index:61; max-width:560px; margin:0 auto; background:var(--s2); border-radius:20px 20px 0 0; padding:8px 16px calc(16px + var(--safe-b)); transform:translateY(105%); transition:transform .24s cubic-bezier(.2,.8,.2,1); max-height:86vh; overflow:auto; }
  #sheet.on { transform:none; }
  #sheet .grab { width:38px; height:4px; border-radius:2px; background:var(--s3); margin:4px auto 12px; }
  #sheet .shead { display:flex; gap:12px; align-items:center; padding:2px 0 12px; border-bottom:1px solid var(--line); margin-bottom:6px; }
  #sheet .shead .th { width:48px; height:48px; }
  #sheet h3 { margin:0 0 6px; font-size:18px; }
  #sheet p { color:var(--mut); margin:0 0 14px; }
  .opt { display:flex; align-items:center; gap:14px; width:100%; padding:13px 4px; text-align:left; border-radius:10px; }
  .opt:active { background:var(--s3); }
  .opt.dng { color:var(--danger); }
  .opt small { display:block; color:var(--mut); font-size:12.5px; }
  .opt svg { color:var(--mut); } .opt.dng svg { color:var(--danger); }
  .sinput { width:100%; height:50px; border-radius:12px; border:1px solid var(--line); background:var(--s1); padding:0 14px; font-size:16px; margin-bottom:14px; outline:0; }
  .sinput:focus { border-color:var(--acc); }

  /* now playing */
  #np { position:fixed; inset:0; z-index:50; background:linear-gradient(180deg,#1b2a22 0%,#0b0b0d 60%); transform:translateY(105%); transition:transform .3s cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column; padding:calc(10px + var(--safe-t)) 24px calc(24px + var(--safe-b)); }
  #np.on { transform:none; }
  #np .top { display:flex; justify-content:space-between; align-items:center; color:var(--mut); font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
  #np .art { flex:1; display:grid; place-items:center; min-height:0; padding:18px 0; }
  #np .art img { width:min(100%, 52vh); aspect-ratio:1; object-fit:cover; border-radius:16px; box-shadow:0 20px 50px rgba(0,0,0,.55); background:var(--s3); }
  #np h2 { font-size:22px; margin:0 0 4px; letter-spacing:-.02em; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  #np .ch { color:var(--mut); margin-bottom:14px; }
  /* seek bars: big thumb and a tall touch area so it is easy to grab with a finger */
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:40px; background:none; margin:0; touch-action:none; cursor:pointer; }
  input[type=range]::-webkit-slider-runnable-track { height:6px; border-radius:3px; background:linear-gradient(to right,var(--acc) var(--p,0%),rgba(255,255,255,.2) var(--p,0%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:26px; height:26px; border-radius:50%; background:#fff; margin-top:-10px; box-shadow:0 2px 8px rgba(0,0,0,.45), 0 0 0 4px rgba(30,215,96,.25); }
  input[type=range]:active::-webkit-slider-thumb { transform:scale(1.15); }
  input[type=range]::-moz-range-track { height:6px; border-radius:3px; background:rgba(255,255,255,.2); }
  input[type=range]::-moz-range-progress { height:6px; border-radius:3px; background:var(--acc); }
  input[type=range]::-moz-range-thumb { width:26px; height:26px; border:0; border-radius:50%; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.45), 0 0 0 4px rgba(30,215,96,.25); }
  .times { display:flex; justify-content:space-between; color:var(--mut); font-size:12px; margin-top:-2px; }
  /* lyrics: full screen over "Ara sona"; synced lines light up as the song goes */
  #ly { position:fixed; inset:0; z-index:55; background:linear-gradient(180deg,#221a3a 0%,#0b0b0d 70%); transform:translateY(105%); transition:transform .3s cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column; padding:calc(10px + var(--safe-t)) 0 calc(12px + var(--safe-b)); }
  #ly.on { transform:none; }
  #ly .top { display:flex; align-items:center; gap:6px; padding:0 12px; max-width:720px; width:100%; margin:0 auto; }
  #ly .top .mt { flex:1; min-width:0; text-align:center; }
  #ly .top .t { font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #ly .top .s { color:var(--mut); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #ly .lang { display:inline-block; font-size:11px; font-weight:700; padding:1px 8px; border-radius:99px; background:rgba(255,255,255,.14); color:var(--fg); margin-left:6px; vertical-align:1px; }
  #lyBody { flex:1; overflow-y:auto; padding:20px 24px 45vh; max-width:720px; width:100%; margin:0 auto; -webkit-overflow-scrolling:touch; }
  #lyBody.plain, #lyBody.none { padding-bottom:40px; }
  .ll { font-size:22px; font-weight:700; line-height:1.35; padding:6px 0; color:rgba(255,255,255,.36); letter-spacing:-.01em; cursor:pointer; transition:color .2s; }
  #ly.big .ll { font-size:29px; }
  .ll.past { color:rgba(255,255,255,.62); }
  .ll.on { color:var(--fg); }
  .ll.loop { color:var(--acc); }
  #lyBody.plain .ll { color:var(--fg); font-weight:600; font-size:19px; cursor:auto; padding:3px 0; }
  #ly.big #lyBody.plain .ll { font-size:25px; }
  #lyBody.plain .ll.gap { height:16px; }
  .lysrc { color:var(--mut); font-size:13px; margin-top:28px; line-height:1.5; }
  .lysrc .link { color:var(--acc); }
  .lyform { display:flex; gap:8px; margin-top:14px; } .lyform .sinput { margin:0; flex:1; }
  .lyform .jbtn { flex:none; }
  .lyctrl { display:flex; justify-content:center; align-items:center; gap:26px; padding-top:8px; }
  .lyctrl button { width:52px; height:52px; border-radius:50%; display:grid; place-items:center; color:var(--fg); }
  .lyctrl button:active { background:var(--s3); }
  .lyctrl .big { width:62px; height:62px; background:var(--fg); color:#000; }
  .lyctrl .big:active { background:#ddd; }
  .lyctrl .on { background:var(--acc); color:var(--acc-ink); }
  .lyctrl .k { font-size:10px; font-weight:800; margin-top:-4px; }
  .lysync { display:flex; justify-content:center; align-items:center; gap:8px; padding-top:6px; font-size:13px; color:var(--mut); }
  .lysync button { min-width:44px; height:32px; padding:0 10px; border-radius:99px; background:rgba(255,255,255,.08); color:var(--fg); font-weight:700; font-size:13px; }
  .lysync button:active { background:var(--s3); }
  .lysync #lyOff { min-width:132px; }
  .lysync #lyOff.on { background:var(--acc); color:var(--acc-ink); }
  #lyBody.pick .ll[data-i] { color:rgba(255,255,255,.8); }
  .ctrls { display:flex; align-items:center; justify-content:center; gap:34px; margin:16px 0 8px; }
  .ctrls .big { width:72px; height:72px; border-radius:50%; background:var(--fg); color:#000; display:grid; place-items:center; }
  .ctrls .big svg { width:30px; height:30px; }
  .ctrls .sm { width:52px; height:52px; display:grid; place-items:center; border-radius:50%; }
  .ctrls .sm svg { width:28px; height:28px; }
  /* "next": bigger, and it answers the tap (colour flash + bounce) so you know it went through */
  .nextb { position:relative; transition:background .15s, color .15s, transform .1s; -webkit-tap-highlight-color:transparent; }
  .nextb:active { background:var(--acc) !important; color:var(--acc-ink) !important; transform:scale(.88); }
  .nextb.fx { animation:nextfx .5s ease-out both; }
  @keyframes nextfx { 0% { transform:scale(.82); background:var(--acc); color:var(--acc-ink); box-shadow:0 0 0 0 rgba(30,215,96,.7); }
    45% { transform:scale(1.12); background:var(--acc); color:var(--acc-ink); box-shadow:0 0 0 14px rgba(30,215,96,0); }
    100% { transform:scale(1); box-shadow:0 0 0 0 rgba(30,215,96,0); } }
  #mini .rb.nextb { width:50px; height:50px; color:var(--fg); }
  #mini .rb.nextb svg { width:28px; height:28px; }
  .ctrls .sm.nextb { width:68px; height:68px; color:var(--fg); }
  .ctrls .sm.nextb svg { width:36px; height:36px; }
  .npcard .rb.nextb { width:52px; height:52px; color:var(--fg); }
  .npcard .rb.nextb svg { width:30px; height:30px; }
  /* sleep timer: the moon turns green and shows the minutes left */
  .offb { position:relative; }
  .offb.on { color:var(--acc); }
  .offb .left { position:absolute; bottom:-4px; left:50%; transform:translateX(-50%); font-size:9px; font-weight:800; line-height:1; background:var(--acc); color:var(--acc-ink); border-radius:6px; padding:2px 4px; white-space:nowrap; }
  .sleepb { position:relative; }
  .sleepb.on { color:var(--acc); }
  .sleepb .left { position:absolute; bottom:-2px; left:50%; transform:translateX(-50%); font-size:10px; font-weight:800; line-height:1; background:var(--acc); color:var(--acc-ink); border-radius:6px; padding:2px 4px; white-space:nowrap; }
  .sleepchip { display:inline-flex; align-items:center; gap:5px; height:26px; padding:0 10px; border-radius:999px; background:var(--s3); color:var(--mut); font-size:12px; font-weight:700; margin-top:-2px; }
  .sleepchip svg.ic { width:14px; height:14px; }
  .sleepchip.on { background:var(--acc); color:var(--acc-ink); }
  .row.osel { cursor:pointer; }
  .row.osel .tick { width:26px; height:26px; flex:none; border-radius:50%; border:2px solid var(--mut); display:grid; place-items:center; }
  .row.osel .tick svg.ic { width:16px; height:16px; stroke-width:3; }
  .row.osel.on { background:var(--s2); }
  .row.osel.on .tick { background:var(--acc); border-color:var(--acc); color:var(--acc-ink); }
  .oselbar { position:sticky; top:calc(64px + var(--safe-t)); z-index:5; background:var(--bg); padding:6px 0; }
  /* three buttons in one row (Llistes): smaller, so they fit on a phone */
  .btnrow.tight { gap:8px; }
  .btnrow.tight .btn { flex:1 1 auto; min-width:0; padding:0 8px; gap:5px; font-size:13px; }
  .btnrow.tight .btn svg.ic { width:18px; height:18px; }
  .btn.spbtn { background:#1db954; color:#04130a; }

<script>
const GUEST = location.pathname.startsWith('/jam');
// in the jam the server must answer as the host's guest even when this browser is also logged in to its own account
const JQ = GUEST ? '?jam=1' : '';
if (GUEST) { const f = window.fetch; window.fetch = (u, o = {}) => f(u, {...o, headers:{...o.headers, 'X-Jam':'1'}}); }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => { if (!s && s !== 0) return ''; s = Math.round(s); const h = s/3600|0, m = (s%3600)/60|0, x = s%60;
  return (h ? h+':'+String(m).padStart(2,'0') : m)+':'+String(x).padStart(2,'0'); };
const fmtLong = s => { if (s < 60) return `${Math.round(s)} s`; const m = Math.round(s/60); return m >= 60 ? `${m/60|0} h ${m%60} min` : `${m} min`; };

// ---------- icons ----------
const P = {
  search:'<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>', play:'<path d="M6 4l14 8-14 8z"/>', pause:'<path d="M7 4h3v16H7zM14 4h3v16h-3z"/>',
  next:'<path d="M5 4l10 8-10 8z"/><path d="M19 5v14"/>', more:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>',
  queue:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>', lists:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
  down:'<path d="M6 9l6 6 6-6"/>', right:'<path d="M9 18l6-6-6-6"/>', left:'<path d="M15 18l-6-6 6-6"/>',
  grip:'<circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/>',
  x:'<path d="M18 6L6 18M6 6l12 12"/>', spark:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>',
  mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8"/>', retry:'<path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/>', check:'<path d="M20 6L9 17l-5-5"/>', qr:'<path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3zM20 14v.01M14 20h.01M20 20h.01M17 17h3v3"/>',
  out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>', edit:'<path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>',
  head:'<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>',
  eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
  phone:'<rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  shuffle:'<path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>',
  music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  lyrics:'<path d="M4 5h16M4 10h16M4 15h9M4 20h6"/><path d="M19 13v6.5"/><circle cx="17" cy="19.5" r="2"/>',
  loop:'<path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  spotify:'<circle cx="12" cy="12" r="10"/><path d="M7 9.5c3.5-1 7.5-.6 10.5 1M7.6 12.6c2.9-.8 6.1-.4 8.6 1M8.2 15.6c2.3-.6 4.7-.3 6.7.8"/>',
  back:'<path d="M3 12a9 9 0 1 0 2.64-6.36L3 8"/><path d="M3 3v5h5"/>', size:'<path d="M3 20l5-14 5 14M5 15h6M14 20l3.5-9 3.5 9M15.2 17h4.6"/>', folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
};
const FILLED = new Set(['play','pause','next','grip','more']);
const I = (n, cls='') => `<svg class="ic ${FILLED.has(n)?'f ':''}${cls}" viewBox="0 0 24 24">${P[n]}</svg>`;

// ---------- state ----------
let S = {songs:{}, playlists:[], queue:[], current:null, jam_url:''}, lastSig = '', dragging = false;
let RS = {}, LQ = '', viewKey = '', swipeOpen = null, pvWait = null;   // RS: download status of search results
let tab = 'queue', openPl = null;   // guests also land on the queue
const SQ = {q:'', res:[], loading:false, err:''};   // search tab
const PQ = {q:'', res:[], loading:false, err:''};   // search inside a playlist
const TABS = GUEST ? [['search','Cerca','search'],['queue','Cua','queue']] : [['search','Cerca','search'],['queue','Cua','queue'],['lists','Llistes','lists']];

// ---------- api / toast ----------
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2600); }
async function api(path, method = 'GET', body) {
  if (OFFLINE) return localApi(path, method, body);
  const r = await fetch(path, {method, headers:{'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && !GUEST && path !== '/api/login') { showLogin(); throw new Error('login'); }
  if (r.status === 401 && GUEST) { showJamLocked(j.error); throw new Error('jam'); }
  if (!r.ok) { toast(j.error || 'Error'); throw new Error(j.error); }
  return j;
}
async function act(path, method, body) { try { const r = await api(path, method, body); lastSig = ''; await poll(); return r; } catch { lastSig = ''; await poll(); return null; } }
let pollSeq = 0;
async function poll() {
  if (OFFLINE) return offPoll();
  const my = ++pollSeq; let st, rs = RS;
  try { const r = await fetch('/api/state', {cache:'no-store'}); if (r.status === 401) { if (GUEST) showJamLocked("La jam s'ha tancat o el codi ha canviat. Torna a escanejar el QR."); else showLogin(); return; }
    if (r.status >= 500) throw 0;   // the PC is off: the tunnel answers with an error page
    st = await r.json(); } catch { netDown(); return; }
  netFails = 0;
  const ids = [...new Set([...SQ.res, ...PQ.res].map(r => r.id))];
  if (ids.length) { try { rs = await (await fetch('/api/songs?ids=' + ids.join(','), {cache:'no-store'})).json(); } catch {} }
  if (my !== pollSeq) return;
  const sig = JSON.stringify([st, rs]);
  if (sig === lastSig) return; lastSig = sig; S = st; RS = rs; if (GUEST) applyBrand(S.brand);
  if (pvWait && statusOf(pvWait.id)?.status === 'ready') { toast(`«${pvWait.title.slice(0, 40)}» ja es pot escoltar`); pvWait = null; }
  syncPlayer(); if (!dragging && !seeking && !swipeOpen) render();
  offSync();
}
const statusOf = id => S.songs[id] || RS[id];

// ---------- on the phone: songs saved to listen without a connection ----------
// What is kept follows the lists marked "Al mòbil" (or every song): new songs are saved and removed ones deleted while online.
// Without a connection the app runs on its own: the lists and songs saved here, and a queue of its own.
const SONG_CACHE = 'conimix-songs', CAN_SAVE = !GUEST && 'caches' in window;
const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
let OFFLINE = false, netFails = 0, OFF = new Set();   // OFF: ids of the songs saved on the phone
const OC = lsGet('cm-off', {all:false, pls:[]});   // what to keep on the phone
let OLIB = lsGet('cm-offlib', {songs:{}, playlists:[]});   // titles and lists, for when there is no connection
let LQS = lsGet('cm-offq', {queue:[], current:null, seq:1});   // the queue without a connection
const OD = {busy:false, done:0, total:0, usage:0, failed:new Set()};
const softRender = () => { lastSig = ''; if (!dragging && !seeking && !swipeOpen) render(); };
const fetchT = (u, ms) => { const c = new AbortController(), t = setTimeout(() => c.abort(), ms); return fetch(u, {cache:'no-store', signal:c.signal}).finally(() => clearTimeout(t)); };
async function offLoad() {
  if (!CAN_SAVE) return;
  try { const c = await caches.open(SONG_CACHE); OFF = new Set((await c.keys()).map(r => new URL(r.url).pathname.match(/^\/media\/(.+)\.mp3$/)?.[1]).filter(Boolean)); } catch {}
  offUsage();
}
function offUsage() { navigator.storage?.estimate?.().then(e => { OD.usage = e.usage || 0; softRender(); }).catch(() => {}); }
const fmtMB = b => b >= 1e9 ? (b / 1e9).toFixed(1).replace('.', ',') + ' GB' : Math.round(b / 1e6) + ' MB';
function offWanted() {
  const ids = OC.all ? Object.keys(S.songs) : S.playlists.filter(p => OC.pls.includes(p.id)).flatMap(p => p.songs);
  return new Set(ids.filter(id => S.songs[id]?.status === 'ready'));
}
const plOnPhone = pl => OC.all || OC.pls.includes(pl.id);
async function offSync() {   // online only: make the phone hold exactly what is marked
  if (!CAN_SAVE || OFFLINE || OD.busy || !S.owner) return;
  OC.pls = OC.pls.filter(id => S.playlists.some(p => p.id === id)); lsSet('cm-off', OC);
  const songs = {}; for (const id of OFF) if (S.songs[id]) songs[id] = S.songs[id];
  OLIB = {songs, playlists: S.playlists.map(p => ({id:p.id, name:p.name, songs:p.songs}))}; lsSet('cm-offlib', OLIB);
  const want = offWanted(); let c;
  try { c = await caches.open(SONG_CACHE); } catch { return; }
  let gone = 0;
  for (const id of [...OFF]) if (!want.has(id)) { await c.delete(`/media/${id}.mp3`); await c.delete(`/media/${id}.jpg`); OFF.delete(id); gone++; }
  const todo = [...want].filter(id => !OFF.has(id) && !OD.failed.has(id));
  if (!todo.length) { if (gone) { offUsage(); softRender(); } return; }
  OD.busy = true; OD.done = 0; OD.total = todo.length; softRender();
  navigator.storage?.persist?.().catch(() => {});   // ask iOS not to clear it
  for (const id of todo) {
    if (OFFLINE) break;
    try {
      const r = await fetch(`/media/${id}.mp3`, {cache:'no-store'});
      if (r.status !== 200) throw new Error('http');
      await c.put(`/media/${id}.mp3`, r);
      try { const t = await fetch(`/media/${id}.jpg`); if (t.ok) await c.put(`/media/${id}.jpg`, t); } catch {}
      OFF.add(id); if (S.songs[id]) OLIB.songs[id] = S.songs[id];
    } catch (e) {
      if (e?.name === 'QuotaExceededError') { toast('No queda espai al mòbil'); break; }
      OD.failed.add(id);   // not again until the app is opened again
    }
    OD.done++; softRender();
  }
  OD.busy = false; lsSet('cm-offlib', OLIB); offUsage(); softRender();

}

function offPoll() {

let probeAt = 0, reconnecting = false, offTouched = false;   // offTouched: the queue was used without a connection
async function offProbe(now) {   // is the PC reachable again?
  if (reconnecting || (!now && performance.now() - probeAt < 5000)) return; probeAt = performance.now();
  try { const r = await fetchT('/api/me', 5000); if (r.status >= 500 || !(await r.json()).owner) return; } catch { return; }

// Back online without reloading: what is playing goes on, at the same point, and the server takes over the phone's queue.
async function reconnect() {
  if (!OFFLINE || reconnecting) return; reconnecting = true;
  try {
    if ((offTouched || audio.currentTime > 0) && LQS.queue.length) {
      for (let tries = 0; tries < 3; tries++) {   // a song may end while the queue is being sent: send it again
        const cur = LQS.current, ci = LQS.queue.findIndex(q => q.qid === cur);
        const r = await fetch('/api/queue/set', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({song_ids:LQS.queue.map(q => q.song_id), current:ci})});
        if (!r.ok) return;   // still offline: try again later
        const j = await r.json();
        if (LQS.current !== cur) continue;
        if (ci >= 0 && j.qids[ci] != null && loaded === cur) loaded = j.qids[ci];   // the same song, so the player is not restarted
        break;
      }
    }
    OFFLINE = false; offTouched = false; netFails = 0; LQS = {queue:[], current:null, seq:1}; lsSet('cm-offq', LQS);
    $('#offBar').hidden = true; $('#qrBtn').hidden = $('#outBtn').hidden = false;
    viewKey = ''; lastSig = ''; toast('Connexió recuperada'); await poll();
  } catch {} finally { reconnecting = false; }
}
function netDown() { if (!GUEST && ++netFails >= 2 && OFF.size && !document.body.dataset.login) enterOffline(); }
addEventListener('online', () => { if (OFFLINE) offProbe(true); });
addEventListener('offline', () => { if (!GUEST && !OFFLINE && OFF.size && !document.body.dataset.login) enterOffline(); });
function enterOffline() {
  if (OFFLINE) return; OFFLINE = true; netFails = 0; OD.busy = false;
  if (S.owner) {   // the queue that was playing carries on, with the songs that are on the phone
    const q = S.queue.filter(x => OFF.has(x.song_id)).map(({qid, song_id}) => ({qid, song_id}));
    LQS = {queue:q, current:S.current, seq:Math.max(0, ...S.queue.map(x => x.qid)) + 1}; lsSet('cm-offq', LQS);
  }

}
// the server's queue rules (server.py: add_to_queue, advance, ...), on the phone
function localApi(path, method, b = {}) {
  const Q = LQS.queue, at = qid => Q.findIndex(q => q.qid === qid), cur = LQS.current, nq = sid => ({qid:LQS.seq++, song_id:sid});
  const advance = from => {
    if (cur == null || (from != null && from !== cur)) return;
    const i = at(cur); Q.splice(i, 1); LQS.current = Q[i]?.qid ?? Q[0]?.qid ?? null;
  };
  switch (path) {
    case '/api/queue/next': advance(b.from); break;
    case '/api/queue/play': { if (cur != null && cur !== b.qid && at(cur) >= 0) Q.splice(at(cur), 1);
      const i = at(b.qid); if (i < 0) break; Q.unshift(...Q.splice(i, 1)); LQS.current = b.qid; break; }
    case '/api/queue/add': { const q = nq(b.song_id), ci = at(cur);
      if (b.mode === 'end') Q.push(q);
      else if (b.mode === 'now') { Q.splice(Math.max(ci, 0), 0, q); LQS.current = q.qid; }
      else Q.splice(ci + 1, 0, q);
      break; }
    case '/api/queue/remove': if (b.qid === cur) advance(b.qid); else if (at(b.qid) >= 0) Q.splice(at(b.qid), 1); break;
    case '/api/queue/clear': Q.length = 0; LQS.current = null; break;
    case '/api/queue/load': { const pl = OLIB.playlists.find(p => p.id === b.playlist_id); if (!pl) break;
      if ((b.mode || 'replace') === 'replace') { Q.length = 0; LQS.current = null; }
      for (const sid of pl.songs) if (OFF.has(sid)) Q.push(nq(sid)); break; }
    case '/api/queue/order': { const m = new Map(Q.map(q => [q.qid, q])); if (b.ids.every(id => m.has(id))) LQS.queue = b.ids.map(id => m.get(id)); break; }
    default: toast('Sense connexió: ara no es pot fer'); throw new Error('offline');
  }
  if (LQS.current == null && LQS.queue.length) LQS.current = LQS.queue[0].qid;
  offTouched = true; lsSet('cm-offq', LQS);
  return {ok:true};
}

function reasonOf(err) {   // yt-dlp's last line, in plain words
  const e = String(err || '');
  if (/private video/i.test(e)) return 'El vídeo és privat';
  if (/confirm your age/i.test(e)) return "Té restricció d'edat";
  if (/members[- ]only/i.test(e)) return 'Només per a membres del canal';
  if (/copyright|has been removed|terminated|unavailable|not available/i.test(e)) return 'El vídeo ja no està disponible';
  if (/not a bot|Sign in|cookies/i.test(e)) return 'YouTube ha frenat les baixades una estona';
  if (/HTTP Error 403/i.test(e)) return 'YouTube ha bloquejat la baixada (cal actualitzar yt-dlp)';
  if (/Interromput/.test(e)) return "S'ha interromput";
  if (/urlopen|timed out|resolve|getaddrinfo|nodename|Connection|network|Temporary failure/i.test(e)) return 'Problema de connexió';
  return e ? e.replace(/^ERROR:\s*/, '').slice(0, 90) : '';
}
function statusBits(s) {
  if (!s) return {sub:'', bar:''};
  const up = String(s.id).startsWith('up_');   // a file the user uploaded: nothing is downloaded
  if (s.status === 'downloading') return {sub: up ? '<span>Pujant…</span>' : `<span>Descarregant ${Math.round(s.progress)}%</span>`, bar:`<div class="bar"><i style="width:${s.progress}%"></i></div>`};
  if (s.status === 'error' && up) return {sub:`<span class="er">${esc(reasonOf(s.error) || "No s'ha pogut llegir el fitxer")}</span>`, bar:''};
  if (s.status === 'error') return {sub: s.auto ? `<span class="wt">${S.online === false ? 'Sense connexió · es baixarà quan torni' : 'Ha fallat · es tornarà a provar sola'}</span>`
    : `<span class="er">No s'ha pogut descarregar${reasonOf(s.error) ? ' · ' + esc(reasonOf(s.error)) : ''}</span>`, bar:''};
  return {sub: OFF.has(s.id) ? `<span class="ok">${I('phone')}Al mòbil</span>` : `<span class="ok">${I('check')}${up ? 'Pujada' : 'Descarregada'}</span>`, bar:''};
}

// The search box is only rebuilt when the view changes, so typing (and the phone keyboard) is never interrupted.
// Makes `el` show `html` changing only what differs: the rows and images that stay are left alone, so a redraw
// (a song saved to the phone, a download that moves on) does not reload every cover and make the screen blink.
function morph(el, html) {
  const t = document.createElement('template'); t.innerHTML = html; morphKids(el, t.content);
}
function morphKids(a, b) {
  const an = [...a.childNodes], bn = [...b.childNodes];
  bn.forEach((y, i) => {
    const x = an[i];
    if (!x) return a.appendChild(y);
    if (x.nodeType !== y.nodeType || x.nodeName !== y.nodeName) return a.replaceChild(y, x);
    if (x.nodeType !== 1) { if (x.nodeValue !== y.nodeValue) x.nodeValue = y.nodeValue; return; }
    if (x.isEqualNode(y)) return;
    // an image whose cover failed shows its YouTube fallback: that is not a change
    const keep = x.nodeName === 'IMG' && x.dataset.fb && x.dataset.fb === y.getAttribute('src') ? ['src', 'onerror', 'data-fb'] : [];
    for (const {name} of [...x.attributes]) if (!keep.includes(name) && !y.hasAttribute(name)) x.removeAttribute(name);
    for (const {name, value} of [...y.attributes]) if (!keep.includes(name) && x.getAttribute(name) !== value) x.setAttribute(name, value);
    morphKids(x, y);

async function runSearch(ctx, q) {

  if (my !== st.seq) return;
  st.res.forEach(r => { const m = d[r.id]; if (!m) return; r.date = m.date || r.date; r.views ??= m.views; r.duration ||= m.duration; if (!r.uploader || r.uploader === 'YouTube Music') r.uploader = m.uploader || r.uploader; });

    : "Per dictar cal obrir l'app amb https. Mentrestant, fes servir el micròfon del teclat");

  if (e.target.id === 'lyRetry') { const s = S.songs[LY.id]; if (s) loadLyrics(s); return; }
  const el = e.target.closest('.ll[data-i]'); if (!el) return;
  const i = +el.dataset.i;
  if (LY.pick) {   // "this is the line playing now" (people tap a little after hearing it start)
    LY.pick = false; lySetOff(audio.currentTime - .3 - LY.lines[i].t); return toast('Lletra sincronitzada');
  }
  if (LY.loopI != null) LY.loopI = i;
  audio.currentTime = Math.max(0, lyT(i)); LY.touched = 0; if (audio.paused) audio.play(); lySync(true);
});
$('#lyBody').addEventListener('submit', e => {
  e.preventDefault(); const q = $('#lyQ').value.trim(), s = S.songs[LY.id];
  if (q && s) { $('#lyQ').blur(); loadLyrics(s, q); }
});

// ---------- preview: listen to a search result on this device before adding it ----------
const pv = $('#pv'); let pvR = null;
function stopPreview() { pv.pause(); pv.removeAttribute('src'); pvR = null; renderPlayer(); lastSig = ''; render(); }
async function previewResult(r) {
  if (!r) return;
  if (pvR && pvR.id === r.id) { if (pv.paused) pv.play(); else pv.pause(); return; }
  if (!GUEST && !audio.paused) return toast('Atura la cua per escoltar una prèvia');
  const s = statusOf(r.id);
  if (!s || s.status === 'error') {
    try { await api('/api/prefetch', 'POST', metaOf(r)); pvWait = r; toast("Descarregant-la… t'avisaré quan la puguis escoltar"); } catch {}
    lastSig = ''; poll(); return;
  }
  if (s.status !== 'ready') { pvWait = r; return toast(`Encara es descarrega (${Math.round(s.progress)}%)`); }
  pvR = r; pv.src = `/media/${r.id}.mp3${JQ}`; pv.play().catch(() => toast("No s'ha pogut reproduir la prèvia")); renderPlayer();
}
pv.addEventListener('play', () => { renderPlayer(); lastSig = ''; render(); });
pv.addEventListener('pause', () => { if (!pvR) return; renderPlayer(); lastSig = ''; render(); });
pv.addEventListener('ended', stopPreview);
pv.addEventListener('timeupdate', () => { if (!pv.duration) return; $('#pvProg').style.width = (pv.currentTime / pv.duration * 100) + '%'; $('#pvTime').textContent = fmt(pv.currentTime) + ' / ' + fmt(pv.duration); });
$('#pvPlay').onclick = () => { if (!GUEST && !audio.paused && pv.paused) return toast('Atura la cua per escoltar una prèvia'); pv.paused ? pv.play() : pv.pause(); };
$('#pvClose').onclick = stopPreview;

// ---------- accounts: log in, sign up (email or Google), profile ----------
let timer = null, ME = null;   // ME: the logged-in user (name, app name, logo, role, ai)
const aiAllowed = () => GUEST ? !!S.ai : !!ME?.ai;
function applyBrand(b) {   // each user chooses the name and logo the app shows
  if (!b) return;
  const name = b.app_name || 'coniMIX';
  $('.logo .mark').src = b.logo || '/static/avatar.jpg';
  $('.logo span').innerHTML = name === 'coniMIX' ? 'coni<b>MIX</b>' : `<b>${esc(name)}</b>`;
  document.title = GUEST ? `${name} · Jam` : name;
  if (GUEST || !b.icon) return;   // "Add to Home Screen" on the iPhone takes this icon and name
  document.querySelector('link[rel=apple-touch-icon]').href = b.icon;
  document.querySelector('link[rel=icon]').href = b.icon;
  document.querySelector('link[rel=manifest]').href = b.manifest;
  document.querySelector('meta[name=apple-mobile-web-app-title]').content = name;
}
async function post(path, body) {   // for the account screens (outside the app's api(): no login redirect)
  const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body || {})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Error');
  return j;
}
function forgetPhone() {   // another user on this phone: the saved songs and lists were someone else's
  try { caches.delete(SONG_CACHE); } catch {}
  for (const k of ['cm-off', 'cm-offlib', 'cm-offq']) try { localStorage.removeItem(k); } catch {}
  OFF = new Set(); OC.all = false; OC.pls = []; OLIB = {songs:{}, playlists:[]}; LQS = {queue:[], current:null, seq:1};
}
function showLogin(mode = 'in') {
  clearInterval(timer); document.body.dataset.login = '1'; audio.pause();
  ['#mini', '#nav'].forEach(s => $(s).style.display = 'none'); $('#qrBtn').hidden = $('#outBtn').hidden = true;
  const up = mode === 'up';
  $('#main').innerHTML = `<form class="login" id="lf"><img class="brand" src="/static/logo.jpg" alt="coniMIX">
    <p class="sub">${up ? 'Crea el teu compte i tindràs la teva pròpia música i llistes' : 'Inicia la sessió per gestionar la teva música'}</p>
    <div class="field">
    ${up ? '<input class="sinput" style="margin:0" id="nm" placeholder="Nom" autocomplete="name" maxlength="60">' : ''}
    <input class="sinput" style="margin:0" type="email" id="em" placeholder="Correu electrònic" autocomplete="email" autocapitalize="off" spellcheck="false" required>
    <div class="searchbar" style="margin:0"><input type="password" id="pw" placeholder="Contrasenya${up ? ' (mínim 8 caràcters)' : ''}" autocomplete="${up ? 'new-password' : 'current-password'}" autocapitalize="off" autocorrect="off" spellcheck="false" required minlength="${up ? 8 : 1}"><button type="button" class="x" id="eye" aria-label="Mostra la contrasenya" style="width:40px;height:40px">${I('eye')}</button></div>
    ${up ? '' : `<label class="chk"><input type="checkbox" id="rem" checked><span>Recorda'm en aquest dispositiu</span></label>`}
    <button class="btn pri block">${up ? 'Crea el compte' : 'Entra'}</button><div id="lerr" class="s" style="color:var(--danger);justify-content:center;white-space:normal"></div>
    <div id="gbtn" style="display:flex;justify-content:center;min-height:0"></div>
    <button type="button" class="btn block" id="swap">${up ? 'Ja tinc compte: entra' : 'No tens compte? Registra\'t'}</button>
    <p class="s" style="justify-content:center;white-space:normal;margin:6px 0 0">Per afegir cançons a una festa, escaneja el codi QR de l'amfitrió.</p></div></form>`;
  $('#eye').onclick = () => { const i = $('#pw'); i.type = i.type === 'password' ? 'text' : 'password'; };
  $('#swap').onclick = () => showLogin(up ? 'in' : 'up');
  $('#lf').onsubmit = async e => {
    e.preventDefault(); $('#lerr').textContent = '';
    try {
      if (up) await post('/api/register', {email:$('#em').value, password:$('#pw').value, name:$('#nm').value});
      else await post('/api/login', {email:$('#em').value, password:$('#pw').value, remember:$('#rem').checked});
      location.reload();
    } catch (err) { $('#lerr').textContent = err.message; }
  };
  googleButton();
}
async function googleButton() {   // "Sign in with Google", when the server has a Google client id
  let cfg = {}; try { cfg = await (await fetch('/api/config')).json(); } catch {}
  if (!cfg.google_client_id || !$('#gbtn')) return;
  if (!window.google?.accounts) await new Promise(res => { const sc = document.createElement('script'); sc.src = 'https://accounts.google.com/gsi/client'; sc.onload = res; sc.onerror = res; document.head.appendChild(sc); });
  if (!window.google?.accounts || !$('#gbtn')) return;
  google.accounts.id.initialize({client_id:cfg.google_client_id, callback: async r => {
    try { await post('/api/google', {credential:r.credential}); location.reload(); } catch (err) { $('#lerr').textContent = err.message; }
  }});
  google.accounts.id.renderButton($('#gbtn'), {theme:'filled_black', size:'large', shape:'pill', text:'continue_with', locale:'ca'});
}
function showPending() {
  clearInterval(timer); document.body.dataset.login = '1';
  ['#mini', '#nav'].forEach(s => $(s).style.display = 'none'); $('#qrBtn').hidden = true;
  $('#main').innerHTML = `<div class="login"><img class="brand" src="/static/logo.jpg" alt="coniMIX">
    <h1 style="font-size:24px">Ja gairebé hi ets, ${esc(ME.name || '')}!</h1>
    <p class="sub">El teu compte (${esc(ME.email)}) està pendent que l'administrador l'aprovi. Quan ho faci, torna a obrir l'app.</p>
    <button class="btn pri block" id="pchk">Comprova-ho ara</button></div>`;
  $('#pchk').onclick = () => location.reload();
}
async function logout() {
  await fetch('/api/logout', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'}).catch(() => {});
  forgetPhone(); location.reload();
}
// a logo picked from the phone, made small (512 px: also the home screen icon) before uploading
const shrinkImage = file => new Promise((res, rej) => {
  const img = new Image(); img.onload = () => {
    const n = 512, c = document.createElement('canvas'), k = Math.max(n / img.width, n / img.height);
    c.width = c.height = n; const x = c.getContext('2d'); const w = img.width * k, h = img.height * k;
    x.drawImage(img, (n - w) / 2, (n - h) / 2, w, h); URL.revokeObjectURL(img.src); res(c.toDataURL('image/jpeg', .88));
  }; img.onerror = rej; img.src = URL.createObjectURL(file);
});
async function refreshMe() { try { const me = await (await fetch('/api/me', {cache:'no-store'})).json(); if (me.user) { ME = me.user; applyBrand(ME); lsSet('cm-xfade', ME.xfade); } } catch {} }
function profileSheet() {
  sheetDone = () => {};
  openSheet(`<div class="shead"><img class="th" src="${esc(ME.logo)}" alt="" style="border-radius:50%"><div class="mt"><div class="t">${esc(ME.name || ME.email)}</div><div class="s">${esc(ME.email)}${ME.role === 'admin' ? ' · administrador' : ''}</div></div></div>
    <button class="opt" id="pfApp">${I('edit')}<span>Nom de l'app<small>${esc(ME.app_name)}</small></span></button>
    <button class="opt" id="pfLogo">${I('music')}<span>Canvia el logo<small>Una foto o imatge del mòbil</small></span></button>
    ${ME.logo !== '/static/avatar.jpg' ? `<button class="opt" id="pfLogoDel">${I('x')}<span>Torna al logo de coniMIX</span></button>` : ''}
    <button class="opt" id="pfName">${I('edit')}<span>El teu nom<small>${esc(ME.name || '')}</small></span></button>
    <button class="opt" id="pfXf">${I('music')}<span>Fosa entre cançons<small>${xfadeSecs() ? `${String(xfadeSecs()).replace('.', ',')} segons` : 'Desactivada'}</small></span></button>
    <button class="opt" id="pfPw">${I('eye')}<span>${ME.has_password ? 'Canvia la contrasenya' : 'Posa una contrasenya'}<small>${ME.google ? 'També pots entrar amb Google' : ''}</small></span></button>
    ${ME.role === 'admin' ? `<button class="opt" id="pfAdmin">${I('lists')}<span>Usuaris<small>Aprova, bloqueja i gestiona els comptes</small></span></button>` : ''}
    <button class="opt dng" id="pfOut">${I('out')}<span>Tanca la sessió<small>Les cançons desades en aquest mòbil s'esborraran</small></span></button>
    <input type="file" id="pfFile" accept="image/*" hidden>`);
  const save = async (body, msg) => { try { await api('/api/profile', 'PATCH', body); await refreshMe(); toast(msg); } catch {} };
  $('#pfApp').onclick = async () => { const v = await input({title:"Nom de l'app", value:ME.app_name, ph:'coniMIX'}); if (v != null) save({app_name:v}, 'Nom canviat'); };
  $('#pfName').onclick = async () => { const v = await input({title:'El teu nom', value:ME.name || ''}); if (v) save({name:v}, 'Fet'); };
  $('#pfXf').onclick = xfadeMenu;
  $('#pfLogo').onclick = () => $('#pfFile').click();
  $('#pfFile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return; closeSheet();
    try { await api('/api/profile/logo', 'POST', {data: await shrinkImage(f)}); await refreshMe(); toast('Logo canviat'); } catch { toast("No s'ha pogut fer servir aquesta imatge"); }
  };
  if ($('#pfLogoDel')) $('#pfLogoDel').onclick = async () => { closeSheet(); try { await api('/api/profile/logo', 'DELETE'); await refreshMe(); toast('Logo de coniMIX'); } catch {} };
  $('#pfPw').onclick = passwordSheet;
  if ($('#pfAdmin')) $('#pfAdmin').onclick = () => { closeSheet(); tab = 'admin'; viewKey = ''; adminLoad(); scrollTo(0, 0); };
  $('#pfOut').onclick = async () => { if (await ask({title:'Tancar la sessió?', text:"Les cançons desades en aquest mòbil s'esborraran (al servidor no es toca res).", ok:'Tanca la sessió', danger:true})) logout(); };
}
async function xfadeMenu() {
  const cur = xfadeSecs();
  const v = await menu({title:'Fosa entre cançons', sub: VOL_OK ? 'La següent cançó entra abans i es fonen' : "A l'iPhone s'encadenen sense fondre",
    items:[{v:'0', icon: cur === 0 ? 'check' : 'x', label:'Desactivada', sub:'Una cançó comença just quan acaba l\'anterior'},
      ...[2, 4, 6, 8, 10, 12].map(n => ({v:String(n), icon: cur === n ? 'check' : 'music', label:`${n} segons`, sub: n === 4 ? 'Per defecte' : ''}))]});
  if (v == null || v === '') return;
  try { await api('/api/profile', 'PATCH', {xfade:+v}); await refreshMe(); lsSet('cm-xfade', +v); toast(+v ? `Fosa de ${v} segons` : 'Fosa desactivada'); } catch {}
}
function passwordSheet() {
  sheetDone = () => {};
  openSheet(`<h3>${ME.has_password ? 'Canvia la contrasenya' : 'Posa una contrasenya'}</h3>
    ${ME.has_password ? '<input class="sinput" type="password" id="pwo" placeholder="Contrasenya actual" autocomplete="current-password">' : ''}
    <input class="sinput" type="password" id="pwn" placeholder="Contrasenya nova (mínim 8 caràcters)" autocomplete="new-password">
    <div id="pwe" class="s" style="color:var(--danger);white-space:normal;margin:-6px 0 10px"></div>
    <div class="btnrow"><button class="btn" data-v="">Cancel·la</button><button class="btn pri" id="pwok">Desa</button></div>`);
  $('#pwok').onclick = async () => {
    try { await post('/api/profile/password', {old:$('#pwo')?.value || '', new:$('#pwn').value}); closeSheet(); await refreshMe(); toast('Contrasenya canviada'); }
    catch (err) { $('#pwe').textContent = err.message; }
  };
}
// ---------- admin: the other users ----------
let ADM = null;
async function adminLoad() { try { ADM = await api('/api/admin/users'); } catch { ADM = []; } lastSig = ''; render(); }
const ago = t => { if (!t) return 'mai'; const d = (Date.now() / 1000 - t) / 86400; return d < 1 / 24 ? 'ara mateix' : d < 1 ? `fa ${Math.round(d * 24)} h` : d < 60 ? `fa ${Math.round(d)} dies` : new Date(t * 1000).toLocaleDateString('ca'); };
const ST = {pending:['Pendent', '#f5b544'], active:['Actiu', 'var(--acc)'], blocked:['Bloquejat', 'var(--danger)']};
function viewAdmin() {
  const us = ADM || [], pend = us.filter(u => u.status === 'pending').length;
  return {key:'admin', pre:`<button class="back" data-act="admback">${I('left')}Tornar</button><h1 class="title">Usuaris</h1>
    ${pend ? `<div class="note" style="color:var(--fg)"><b>${pend === 1 ? '1 compte espera' : pend + ' comptes esperen'} que l'aprovis</b></div>` : ''}`,
    post: !ADM ? '<div class="skel"></div><div class="skel"></div>' : `<div class="list">${us.map(u => `<button class="pcard" data-act="admuser" data-id="${u.id}">
      <div class="cover" style="border-radius:50%"><img src="${esc(u.logo)}" alt=""></div>
      <div class="mt"><div class="t">${esc(u.name || u.email)}${u.role === 'admin' ? ' · admin' : ''}</div>
        <div class="s"><span style="color:${ST[u.status][1]}">${ST[u.status][0]}</span><span>${esc(u.email)}</span></div>
        <div class="s" style="white-space:normal">${u.songs} cançons · ${u.playlists} llistes · ${fmtMB(u.bytes)} · IA ${u.ai ? 'sí' : 'no'} · ${ago(u.last_seen)}</div></div>${I('right')}</button>`).join('')}</div>`};
}
async function adminUser(id) {
  const u = ADM.find(x => x.id === id); if (!u) return; const self = u.id === ME.id;
  const items = [
    ...(u.status !== 'active' ? [{v:'active', icon:'check', label: u.status === 'pending' ? 'Aprova el compte' : 'Desbloqueja'}] : []),
    {v:'ai', icon:'spark', label: u.ai ? 'Desactiva la IA' : 'Activa la IA', sub:'La cerca i les llistes amb IA es paguen amb la teva clau de Claude'},
    ...(self ? [] : [{v:'pw', icon:'eye', label:'Contrasenya temporal', sub:'Per si se li ha oblidat: n\'hi dones una de nova'},
      {v:'role', icon:'lists', label: u.role === 'admin' ? "Treu-li l'administració" : 'Fes-lo administrador'},
      ...(u.status === 'active' ? [{v:'blocked', icon:'x', label:'Bloqueja', sub:'No podrà entrar fins que el desbloquegis', danger:true}] : []),
      {v:'del', icon:'trash', label:'Esborra el compte', sub:'Amb totes les seves cançons i llistes', danger:true}])];
  const v = await menu({title:u.name || u.email, sub:u.email, thumb:u.logo, items}); if (!v) return;
  const patch = body => api('/api/admin/users/' + id, 'PATCH', body).catch(() => null);
  if (v === 'active' || v === 'blocked') { if (v === 'blocked' && !await ask({title:`Bloquejar ${u.name || u.email}?`, text:'Se li tancarà la sessió i no podrà entrar.', ok:'Bloqueja', danger:true})) return; await patch({status:v}); toast(v === 'active' ? 'Fet: ja pot fer servir l\'app' : 'Bloquejat'); }
  else if (v === 'ai') { await patch({ai:!u.ai}); toast(u.ai ? 'IA desactivada' : 'IA activada'); }
  else if (v === 'role') { await patch({role: u.role === 'admin' ? 'user' : 'admin'}); }
  else if (v === 'pw') { const r = await api(`/api/admin/users/${id}/password`, 'POST').catch(() => null);
    if (r) { sheetDone = () => {}; openSheet(`<h3>Contrasenya temporal</h3><p>Dona-li aquesta contrasenya a ${esc(u.name || u.email)}. Després la pot canviar des del seu perfil.</p><div class="note" style="font-size:22px;text-align:center;color:var(--fg);font-family:monospace">${esc(r.password)}</div><div class="btnrow"><button class="btn pri" data-v="">Fet</button></div>`); } }
  else if (v === 'del' && await ask({title:`Esborrar ${u.name || u.email}?`, text:`Se n'esborraran les ${u.songs} cançons (${fmtMB(u.bytes)}) i les ${u.playlists} llistes. No es pot desfer.`, ok:'Esborra', danger:true})) { await api('/api/admin/users/' + id, 'DELETE').catch(() => {}); toast('Compte esborrat'); }
  adminLoad();
}
function showJamLocked(msg) {
  clearInterval(timer); document.body.dataset.login = '1'; pv.pause();
  ['#mini', '#nav', '#pvbar'].forEach(s => $(s).style.display = 'none'); $('#jamBar').hidden = true;
  $('#main').innerHTML = `<div class="login"><img class="brand" src="/static/logo.jpg" alt="coniMIX">
    <h1 style="font-size:24px">Benvingut a la jam!</h1><p class="sub">${esc(msg || "Per entrar-hi, escaneja amb la càmera el codi QR que et mostrarà l'amfitrió.")}</p>
    <a class="btn block" href="/" style="text-decoration:none">Sóc l'amfitrió</a></div>`;
}
(async () => {
  if (GUEST) {
    const k = new URLSearchParams(location.search).get('k'); let joinErr = '';
    if (k) {
      const r = await fetch('/api/jam/join', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({k})});
      if (!r.ok) joinErr = (await r.json().catch(() => ({}))).error || '';
      history.replaceState(null, '', '/jam');   // the code is not kept in the address bar
    }
    const me = await (await fetch('/api/me')).json().catch(() => ({}));
    if (!me.guest) return showJamLocked(joinErr);
  }
  if (!GUEST) {
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
    await offLoad();
    let me = null; try { const r = await fetchT('/api/me', 6000); if (r.status < 500) me = await r.json(); } catch {}
    if (!me && OFF.size) { enterOffline(); timer = setInterval(poll, 1500); return; }   // no connection: what is on the phone
    if (!me?.user) return showLogin();
    ME = me.user; applyBrand(ME); lsSet('cm-xfade', ME.xfade);
    if (String(lsGet('cm-uid', '')) !== String(ME.id)) { if (lsGet('cm-uid', '')) forgetPhone(); lsSet('cm-uid', ME.id); }
    if (ME.status === 'pending') return showPending();
    if (!me.owner) return showLogin();
  }
  render(); await poll(); timer = setInterval(poll, 1500);
})();
</script>
